                  AllModulesRegistry.registerAll();
                  SettingManager.load();

                  Runtime.getRuntime().addShutdownHook(new Thread(SettingManager::save, "EternalClient-ConfigSave"));
                  ClientLifecycleEvents.CLIENT_STOPPING.register(client -> SettingManager.save());

                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.open_gui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          KEY_CATEGORY
                  ));

                  cycleModuleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.cycle_module",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_CONTROL,
                          KEY_CATEGORY
                  ));

                  HudRenderCallback.EVENT.register((drawContext, renderTickCounter) -> {
                      if (net.minecraft.client.MinecraftClient.getInstance().getDebugHud().shouldShowDebugHud()) {
                          return;
                      }
                      ModuleManager.renderAllHud(drawContext);
                      NotificationManager.render(drawContext);
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openGuiKey.wasPressed()) {
                          if (client.currentScreen instanceof ClickGui) {
                              client.setScreen(null);
                          } else {
                              client.setScreen(new ClickGui());
                          }
                      }
                      while (cycleModuleKey.wasPressed()) {
                          ModuleManager.cycle();
                      }
                      if (client.player != null && client.world != null) {
                          if (client.player.isDead() && !wasDeadLastTick) {
                              wasDeadLastTick = true;
                              ClientDataManager.incrementDeaths();
                          } else if (!client.player.isDead()) {
                              wasDeadLastTick = false;
                          }

                          for (Module m : ModuleManager.all()) {
                              int key = m.getKeyBind();
                              if (key != GLFW.GLFW_KEY_UNKNOWN && key > 0 && client.currentScreen == null) {
                                  boolean down = InputUtil.isKeyPressed(client.getWindow(), key);
                                  if (down) {
                                      if (!m.wasKeyPressedLastTick()) {
                                          m.setKeyPressedLastTick(true);
                                          m.toggle();
                                      }
                                  } else {
                                      m.setKeyPressedLastTick(false);
                                  }
                              } else {
                                  m.setKeyPressedLastTick(false);
                              }
                          }
                          ModuleManager.tickAll(client);
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/mixin/GameRendererMixin.java
          package bench.client.mixin;

          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import net.minecraft.client.render.GameRenderer;
          import net.minecraft.entity.LivingEntity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(GameRenderer.class)
          public class GameRendererMixin {
              @Inject(method = "getNightVisionStrength", at = @At("HEAD"), cancellable = true)
              private static void onGetNightVisionStrength(LivingEntity entity, float tickDelta, CallbackInfoReturnable<Float> cir) {
                  Module fb = ModuleManager.byName("Fullbright");
                  if (fb != null && fb.isEnabled()) {
                      cir.setReturnValue(1.0f);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/mixin/MinecraftClientMixin.java
          package bench.client.mixin;

          import bench.client.core.ClientDataManager;
          import net.minecraft.client.MinecraftClient;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(MinecraftClient.class)
          public class MinecraftClientMixin {
              @Inject(method = "doAttack", at = @At("HEAD"))
              private void onDoAttack(CallbackInfoReturnable<Boolean> cir) {
                  ClientDataManager.recordLeftClick();
              }

              @Inject(method = "doItemUse", at = @At("HEAD"))
              private void onDoItemUse(CallbackInfo ci) {
                  ClientDataManager.recordRightClick();
              }
          }
          EOF

          # Remove leading spaces added by the YAML block
          for f in settings.gradle gradle.properties build.gradle src/main/resources/fabric.mod.json src/main/resources/benchclient.mixins.json src/main/resources/assets/benchclient/lang/en_us.json $(find src -name "*.java"); do
            sed -i 's/^          //' "$f"
          done

          zip -r EternalBenchClient-Source.zip settings.gradle gradle.properties build.gradle src/

      - name: Set up JDK 21
