          cat << 'EOF' > src/main/java/bench/client/core/ModuleManager.java
          package bench.client.core;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          public final class ModuleManager {
              private static final List<Module> MODULES = new ArrayList<>();
              private static int cycleIndex = 0;

              private ModuleManager() {
              }

              public static void register(Module module) {
                  if (byName(module.getName()) == null) {
                      MODULES.add(module);
                  }
              }

              public static Module byName(String name) {
                  for (Module m : MODULES) {
                      if (m.getName().equalsIgnoreCase(name)) {
                          return m;
                      }
                  }
                  return null;
              }

              public static <T extends Module> T get(Class<T> clazz) {
                  for (Module m : MODULES) {
                      if (clazz.isInstance(m)) {
                          return clazz.cast(m);
                      }
                  }
                  return null;
              }

              public static List<Module> all() {
                  return Collections.unmodifiableList(MODULES);
              }

              public static List<Module> byCategory(Category category) {
                  List<Module> list = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m.getCategory() == category) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              public static List<Module> favorites() {
                  List<Module> list = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m.isFavorite()) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              public static List<Module> search(String query) {
                  if (query == null || query.isBlank()) {
                      return all();
                  }
                  String q = query.toLowerCase(Locale.ROOT).trim();
                  List<Module> list = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m.getName().toLowerCase(Locale.ROOT).contains(q)
                              || m.getDescription().toLowerCase(Locale.ROOT).contains(q)) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              public static List<Module> findKeybindConflicts(int keyCode, Module exclude) {
                  if (keyCode <= 0) {
                      return Collections.emptyList();
                  }
                  List<Module> conflicts = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m != exclude && m.getKeyBind() == keyCode) {
                          conflicts.add(m);
                      }
                  }
                  return conflicts;
              }

              public static void cycle() {
                  if (MODULES.isEmpty()) {
                      return;
                  }
                  Module m = MODULES.get(cycleIndex % MODULES.size());
                  m.toggle();
                  cycleIndex = (cycleIndex + 1) % MODULES.size();
              }

              public static void tickAll(MinecraftClient client) {
                  for (Module m : MODULES) {
                      if (m.isEnabled()) {
                          try {
                              m.onTick(client);
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }

              public static void renderAllHud(DrawContext context) {
                  for (Module m : MODULES) {
                      if (m.isEnabled()) {
                          try {
                              m.onRenderHud(context);
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/ClientDataManager.java
          package bench.client.core;

          import net.minecraft.util.math.BlockPos;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.LinkedList;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public final class ClientDataManager {
              public record Waypoint(String name, int x, int y, int z, String dimension, int color) {}

              private static final List<Long> LEFT_CLICKS = new LinkedList<>();
              private static final List<Long> RIGHT_CLICKS = new LinkedList<>();
              private static final Set<String> FRIENDS = new HashSet<>();
              private static final List<Waypoint> WAYPOINTS = new ArrayList<>();

              private static final long SESSION_START_MS = System.currentTimeMillis();
              private static int sessionDeaths = 0;

              static {
                  WAYPOINTS.add(new Waypoint("Spawn", 0, 64, 0, "minecraft:overworld", 0xFF3B82F6));
              }

              private ClientDataManager() {
              }

              public static void recordLeftClick() {
                  synchronized (LEFT_CLICKS) {
                      LEFT_CLICKS.add(System.currentTimeMillis());
                  }
              }

              public static void recordRightClick() {
                  synchronized (RIGHT_CLICKS) {
                      RIGHT_CLICKS.add(System.currentTimeMillis());
                  }
              }

              public static int getLeftCps(int windowMs) {
                  long cutoff = System.currentTimeMillis() - Math.max(250, windowMs);
                  synchronized (LEFT_CLICKS) {
                      LEFT_CLICKS.removeIf(t -> t < cutoff);
                      return (int) Math.round(LEFT_CLICKS.size() * (1000.0 / Math.max(250, windowMs)));
                  }
              }

              public static int getRightCps(int windowMs) {
                  long cutoff = System.currentTimeMillis() - Math.max(250, windowMs);
                  synchronized (RIGHT_CLICKS) {
                      RIGHT_CLICKS.removeIf(t -> t < cutoff);
                      return (int) Math.round(RIGHT_CLICKS.size() * (1000.0 / Math.max(250, windowMs)));
                  }
              }

              public static boolean isFriend(String name) {
                  return name != null && FRIENDS.contains(name.toLowerCase(Locale.ROOT));
              }

              public static void toggleFriend(String name) {
                  if (name == null || name.isBlank()) {
                      return;
                  }
                  String key = name.toLowerCase(Locale.ROOT);
                  if (FRIENDS.contains(key)) {
                      FRIENDS.remove(key);
                      NotificationManager.push("Friends", "Removed " + name, false);
                  } else {
                      FRIENDS.add(key);
                      NotificationManager.push("Friends", "Added " + name, true);
                  }
                  SettingManager.save();
              }

              public static Set<String> getFriends() {
                  return Collections.unmodifiableSet(FRIENDS);
              }

              public static void setFriendsFromConfig(List<String> list) {
                  FRIENDS.clear();
                  for (String s : list) {
                      if (s != null && !s.isBlank()) {
                          FRIENDS.add(s.toLowerCase(Locale.ROOT));
                      }
                  }
              }

              public static List<Waypoint> getWaypoints() {
                  return Collections.unmodifiableList(WAYPOINTS);
              }

              public static void addWaypoint(String name, BlockPos pos, String dimension, int color) {
                  WAYPOINTS.add(new Waypoint(name, pos.getX(), pos.getY(), pos.getZ(), dimension, color));
                  NotificationManager.push("Waypoints", "Saved " + name + " (" + pos.toShortString() + ")", true);
                  SettingManager.save();
              }

              public static void setWaypointsFromConfig(List<Waypoint> loaded) {
                  WAYPOINTS.clear();
                  WAYPOINTS.addAll(loaded);
              }

              public static void incrementDeaths() {
                  sessionDeaths++;
              }

              public static int getSessionDeaths() {
                  return sessionDeaths;
              }

              public static String getSessionDurationFormatted() {
                  long elapsedSec = Math.max(0L, (System.currentTimeMillis() - SESSION_START_MS) / 1000L);
                  long mins = elapsedSec / 60L;
                  long secs = elapsedSec % 60L;
                  return String.format(Locale.ROOT, "%02dm %02ds", mins, secs);
              }
          }
          EOF

