                  ModuleManager.register(new Module(
                          "Auto Tool",
                          Category.MINING,
                          "Selects the best hotbar tool when mining a block and restores the previous slot afterward."
                  ) {
                      public final BoolSetting restoreSlot = add(new BoolSetting("Restore Slot", "Restore previous slot when mining stops.", true));
                      private int previousSlot = -1;

                      @Override
                      public void onTick(MinecraftClient client) {
                          if (client.player == null || client.world == null) {
                              return;
                          }
                          if (!client.options.attackKey.isPressed()) {
                              if (restoreSlot.getValue() && previousSlot != -1) {
                                  client.player.getInventory().setSelectedSlot(previousSlot);
                                  previousSlot = -1;
                              }
                              return;
                          }
                          if (!(client.crosshairTarget instanceof BlockHitResult bhr) || client.crosshairTarget.getType() != HitResult.Type.BLOCK) {
                              return;
                          }
                          BlockState state = client.world.getBlockState(bhr.getBlockPos());
                          if (state.isAir()) {
                              return;
                          }
                          int bestSlot = -1;
                          float bestSpeed = client.player.getMainHandStack().getMiningSpeedMultiplier(state);
                          for (int i = 0; i < 9; i++) {
                              float s = client.player.getInventory().getStack(i).getMiningSpeedMultiplier(state);
                              if (s > bestSpeed) {
                                  bestSpeed = s;
                                  bestSlot = i;
                              }
                          }
                          if (bestSlot != -1 && bestSlot != client.player.getInventory().getSelectedSlot()) {
                              if (previousSlot == -1) {
                                  previousSlot = client.player.getInventory().getSelectedSlot();
                              }
                              client.player.getInventory().setSelectedSlot(bestSlot);
                          }
                      }
                  });

