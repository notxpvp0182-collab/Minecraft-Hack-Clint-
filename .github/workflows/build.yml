          package bench.client.modules.render;

          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.EnumSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.Module;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.Camera;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.math.Vec3d;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;

          public class ESP extends Module {
              public enum Mode {
                  BOX,
                  GLOW
              }

              public final IntSetting colorHex = add(new IntSetting("ColorRGB", 0x00FFAA, 0x000000, 0xFFFFFF));
              public final EnumSetting<Mode> mode = add(new EnumSetting<>("Mode", Mode.BOX));
              public final DoubleSetting range = add(new DoubleSetting("Range", 64.0, 8.0, 256.0));

              public ESP() {
                  super("ESP", Category.RENDER);
              }

              @Override
              public void onTick(MinecraftClient client) {
              }

              public void renderOverlay(DrawContext context) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null || client.world == null || client.gameRenderer == null) {
                      return;
                  }
                  Camera camera = client.gameRenderer.getCamera();
                  Vec3d camPos = client.player.getEyePos();
                  Quaternionf invRot = new Quaternionf(camera.getRotation()).conjugate();

                  int sw = context.getScaledWindowWidth();
                  int sh = context.getScaledWindowHeight();
                  double fov = client.options.getFov().getValue();
                  double f = (sh / 2.0) / Math.tan(Math.toRadians(fov / 2.0));

                  int color = 0xFF000000 | (colorHex.getValue() & 0xFFFFFF);
                  double maxDistSq = range.getValue() * range.getValue();

                  for (PlayerEntity target : client.world.getPlayers()) {
                      if (target == client.player || !target.isAlive()) {
                          continue;
                      }
                      double distSq = client.player.squaredDistanceTo(target);
                      if (distSq > maxDistSq) {
                          continue;
                      }

                      Vec3d rel = new Vec3d(
                              target.getX() - camPos.x,
                              target.getY() + target.getHeight() * 0.5 - camPos.y,
                              target.getZ() - camPos.z
                      );
                      Vector3f v = new Vector3f((float) rel.x, (float) rel.y, (float) rel.z).rotate(invRot);
                      if (v.z >= -0.1f) {
                          continue;
                      }

                      double depth = -v.z;
                      int cx = (int) (sw / 2.0 + (v.x / depth) * f);
                      int cy = (int) (sh / 2.0 - (v.y / depth) * f);
                      int boxH = Math.max(8, (int) ((target.getHeight() / depth) * f));
                      int boxW = Math.max(6, boxH / 2);

                      int x1 = cx - boxW / 2;
                      int y1 = cy - boxH / 2;
                      int x2 = cx + boxW / 2;
                      int y2 = cy + boxH / 2;

                      if (mode.getValue() == Mode.GLOW) {
                          context.fill(x1 - 1, y1 - 1, x2 + 1, y2 + 1, 0x4400FFAA);
                      }
                      context.fill(x1, y1, x2, y1 + 1, color);
                      context.fill(x1, y2 - 1, x2, y2, color);
                      context.fill(x1, y1, x1 + 1, y2, color);
                      context.fill(x2 - 1, y1, x2, y2, color);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/modules/render/Tracers.java
          package bench.client.modules.render;

          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.Module;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.Camera;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.math.Vec3d;
          import org.joml.Quaternionf;
          import org.joml.Vector3f;

          public class Tracers extends Module {
              public final IntSetting colorHex = add(new IntSetting("ColorRGB", 0xFF5555, 0x000000, 0xFFFFFF));
              public final DoubleSetting range = add(new DoubleSetting("Range", 128.0, 16.0, 256.0));

              public Tracers() {
                  super("Tracers", Category.RENDER);
              }

              @Override
              public void onTick(MinecraftClient client) {
              }

              public void renderOverlay(DrawContext context) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null || client.world == null || client.gameRenderer == null) {
                      return;
                  }
                  Camera camera = client.gameRenderer.getCamera();
                  Vec3d camPos = client.player.getEyePos();
                  Quaternionf invRot = new Quaternionf(camera.getRotation()).conjugate();

                  int sw = context.getScaledWindowWidth();
                  int sh = context.getScaledWindowHeight();
                  double fov = client.options.getFov().getValue();
                  double f = (sh / 2.0) / Math.tan(Math.toRadians(fov / 2.0));

                  int color = 0xFF000000 | (colorHex.getValue() & 0xFFFFFF);
                  double maxDistSq = range.getValue() * range.getValue();
                  int startX = sw / 2;
                  int startY = sh / 2;

                  for (PlayerEntity target : client.world.getPlayers()) {
                      if (target == client.player || !target.isAlive()) {
                          continue;
                      }
                      if (client.player.squaredDistanceTo(target) > maxDistSq) {
                          continue;
                      }

                      Vec3d rel = new Vec3d(
                              target.getX() - camPos.x,
                              target.getY() + target.getHeight() * 0.5 - camPos.y,
                              target.getZ() - camPos.z
                      );
                      Vector3f v = new Vector3f((float) rel.x, (float) rel.y, (float) rel.z).rotate(invRot);
                      if (v.z >= -0.1f) {
                          continue;
                      }

                      double depth = -v.z;
                      int endX = (int) (sw / 2.0 + (v.x / depth) * f);
                      int endY = (int) (sh / 2.0 - (v.y / depth) * f);
                      drawLine2D(context, startX, startY, endX, endY, color);
                  }
              }

              private void drawLine2D(DrawContext context, int x0, int y0, int x1, int y1, int color) {
                  int dx = x1 - x0;
                  int dy = y1 - y0;
                  int steps = Math.min(200, Math.max(Math.abs(dx), Math.abs(dy)));
                  if (steps == 0) {
                      return;
                  }
                  for (int i = 0; i <= steps; i += 2) {
                      int px = x0 + (dx * i) / steps;
                      int py = y0 + (dy * i) / steps;
                      context.fill(px, py, px + 1, py + 1, color);
                  }
              }
