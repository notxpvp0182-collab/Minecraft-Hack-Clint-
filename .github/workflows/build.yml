          package bench.client.modules.combat;

          import bench.client.core.BoolSetting;
          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.command.argument.EntityAnchorArgumentType;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.Hand;

          public class KillAura extends Module {
              public final DoubleSetting range = add(new DoubleSetting("Range", 4.2, 2.0, 6.0));
              public final BoolSetting playersOnly = add(new BoolSetting("PlayersOnly", false));
              public final IntSetting cps = add(new IntSetting("CPS", 10, 1, 20));

              private int tickTimer = 0;

              public KillAura() {
                  super("KillAura", Category.COMBAT);
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.world == null || client.interactionManager == null) {
                      return;
                  }
                  tickTimer++;
                  int delayTicks = Math.max(1, 20 / cps.getValue());
                  if (tickTimer < delayTicks) {
                      return;
                  }

                  double maxDistSq = range.getValue() * range.getValue();
                  LivingEntity nearest = null;
                  double nearestDistSq = maxDistSq;

                  for (Entity entity : client.world.getEntities()) {
                      if (entity == client.player || !(entity instanceof LivingEntity living)) {
                          continue;
                      }
                      if (!living.isAlive() || living.isDead()) {
                          continue;
                      }
                      if (playersOnly.getValue() && !(living instanceof PlayerEntity)) {
                          continue;
                      }
                      double dSq = client.player.squaredDistanceTo(living);
                      if (dSq <= nearestDistSq) {
                          nearestDistSq = dSq;
                          nearest = living;
                      }
                  }

                  if (nearest != null) {
                      tickTimer = 0;
                      Criticals criticals = ModuleManager.get(Criticals.class);
                      if (criticals != null && criticals.isEnabled()) {
                          criticals.triggerCritical(client);
                      }
                      client.player.lookAt(EntityAnchorArgumentType.EntityAnchor.EYES, nearest.getEyePos());
                      client.interactionManager.attackEntity(client.player, nearest);
                      client.player.swingHand(Hand.MAIN_HAND);
                  }
              }
          }
