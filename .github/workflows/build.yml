              private void onSetVelocityClient(Vec3d clientVelocity, CallbackInfo ci) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client != null && (Object) this == client.player) {
                      Velocity velocity = ModuleManager.get(Velocity.class);
                      if (velocity != null && velocity.isEnabled()) {
                          double h = velocity.horizontal.getValue();
                          double v = velocity.vertical.getValue();
                          Vec3d cur = this.getVelocity();
                          this.setVelocity(
                                  cur.x + (clientVelocity.x - cur.x) * h,
                                  cur.y + (clientVelocity.y - cur.y) * v,
                                  cur.z + (clientVelocity.z - cur.z) * h
                          );
                          ci.cancel();
                      }
                  }
              }
          }
