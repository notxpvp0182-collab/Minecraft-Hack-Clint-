name: Build Eternal BenchClient 1.21.11 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod with Gradle
        run: |
          gradle clean build
          cp build/libs/EternalBenchClient-3.0.0.jar EternalBenchClient-1.21.11.jar
          zip -r EternalBenchClient-Source.zip settings.gradle gradle.properties build.gradle src/

      - name: Upload EternalBenchClient-1.21.11.jar and Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EternalBenchClient-1.21.11-Release
          path: |
            EternalBenchClient-1.21.11.jar
            build/libs/*.jar
            !build/libs/*-sources.jar
            EternalBenchClient-Source.zip
