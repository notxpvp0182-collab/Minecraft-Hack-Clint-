name: Build Eternal BenchClient 1.21.11 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Upgraded Project
        run: |
          rm -rf src build
          mkdir -p src/main/java/bench/client/core
          mkdir -p src/main/java/bench/client/gui
          mkdir -p src/main/java/bench/client/mixin
          mkdir -p src/main/java/bench/client/modules
          mkdir -p src/main/resources/assets/benchclient/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'benchclient'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          loom_version=1.14.10
          fabric_version=0.141.6+1.21.11
          mod_version=2.5.0
          maven_group=bench.client
          archives_base_name=EternalBenchClient
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "benchclient",
            "version": "${version}",
            "name": "Eternal BenchClient",
            "description": "Modular Client Utility, HUD Suite & Practice Mod for Minecraft 1.21.11. Credit: Ahmad.",
            "authors": [
              "Ahmad"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "bench.client.BenchClient"
              ]
            },
            "mixins": [
              "benchclient.mixins.json"
            ],
            "depends": {
              "fabricloader": "*",
              "minecraft": "=1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/benchclient.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "bench.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "GameRendererMixin",
              "MinecraftClientMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/benchclient/lang/en_us.json
          {
            "key.category.benchclient.general": "Eternal Client",
            "key.benchclient.open_gui": "Open Eternal ClickGUI",
            "key.benchclient.cycle_module": "Cycle Module"
          }
          EOF

