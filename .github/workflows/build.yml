          package bench.client.modules.combat;

          import bench.client.core.BoolSetting;
          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.Module;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;

          public class AimAssist extends Module {
              public final DoubleSetting range = add(new DoubleSetting("Range", 5.0, 2.5, 8.0));
              public final DoubleSetting speed = add(new DoubleSetting("SmoothSpeed", 0.30, 0.05, 1.0));
              public final BoolSetting playersOnly = add(new BoolSetting("PlayersOnly", true));

              public AimAssist() {
                  super("AimAssist", Category.COMBAT);
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.world == null || client.currentScreen != null) {
                      return;
                  }
                  double maxSq = range.getValue() * range.getValue();
                  LivingEntity nearest = null;
                  double nearestSq = maxSq;

                  for (Entity entity : client.world.getEntities()) {
                      if (entity == client.player || !(entity instanceof LivingEntity living)) {
                          continue;
                      }
                      if (!living.isAlive() || living.isDead()) {
                          continue;
                      }
                      if (playersOnly.getValue() && !(living instanceof PlayerEntity)) {
                          continue;
                      }
                      double dSq = client.player.squaredDistanceTo(living);
                      if (dSq <= nearestSq) {
                          nearestSq = dSq;
                          nearest = living;
                      }
                  }

                  if (nearest != null) {
                      AutoFight.smoothRotateTowards(client.player, nearest, speed.getValue().floatValue());
                  }
              }
          }
