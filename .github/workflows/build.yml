name: Build BenchClient 1.21.11 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          rm -rf src build
          mkdir -p src/main/java/bench/client/core
          mkdir -p src/main/java/bench/client/gui
          mkdir -p src/main/java/bench/client/mixin
          mkdir -p src/main/java/bench/client/modules/combat
          mkdir -p src/main/java/bench/client/modules/movement
          mkdir -p src/main/java/bench/client/modules/render
          mkdir -p src/main/java/bench/client/modules/player
          mkdir -p src/main/java/bench/client/modules/misc
          mkdir -p src/main/resources/assets/benchclient/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'benchclient'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          loom_version=1.14.10
          fabric_version=0.141.6+1.21.11
          mod_version=1.0.0
          maven_group=bench.client
          archives_base_name=benchclient
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "benchclient",
            "version": "${version}",
            "name": "BenchClient",
            "description": "Client-side utility mod for Minecraft 1.21.11.",
            "authors": [
              "Ahmad"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "bench.client.BenchClient"
              ]
            },
            "mixins": [
              "benchclient.mixins.json"
            ],
            "depends": {
              "fabricloader": "*",
              "minecraft": "=1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/benchclient.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "bench.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "BlockRenderMixin",
              "PlayerEntityMixin",
              "ClientPlayerEntityMixin",
              "EntityStepMixin",
              "GameRendererMixin",
              "MinecraftClientMixin",
              "ClientPlayerInteractionManagerMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/benchclient/lang/en_us.json
          {
            "key.category.benchclient.general": "BenchClient",
            "key.benchclient.open_gui": "Open ClickGUI",
            "key.benchclient.cycle_module": "Cycle Module"
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/BenchClient.java
          package bench.client;

          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import bench.client.core.SettingManager;
          import bench.client.gui.ClickGui;
          import bench.client.modules.combat.AutoTotem;
          import bench.client.modules.combat.Criticals;
          import bench.client.modules.combat.KillAura;
          import bench.client.modules.combat.Reach;
          import bench.client.modules.combat.Velocity;
          import bench.client.modules.misc.AntiAFK;
          import bench.client.modules.misc.ChatSuffix;
          import bench.client.modules.misc.Timer;
          import bench.client.modules.movement.AutoJump;
          import bench.client.modules.movement.Fly;
          import bench.client.modules.movement.NoFall;
          import bench.client.modules.movement.SafeWalk;
          import bench.client.modules.movement.Speed;
          import bench.client.modules.movement.Sprint;
          import bench.client.modules.movement.Step;
          import bench.client.modules.player.AutoTool;
          import bench.client.modules.player.FastBreak;
          import bench.client.modules.player.FastPlace;
          import bench.client.modules.render.ESP;
          import bench.client.modules.render.Fullbright;
          import bench.client.modules.render.Hud;
          import bench.client.modules.render.Nametags;
          import bench.client.modules.render.Tracers;
          import bench.client.modules.render.Xray;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.message.v1.ClientSendMessageEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class BenchClient implements ClientModInitializer {
              public static final KeyBinding.Category KEY_CATEGORY = KeyBinding.Category.create(
                      Identifier.of("benchclient", "general")
              );

              private static KeyBinding openGuiKey;
              private static KeyBinding cycleModuleKey;

              @Override
              @SuppressWarnings("deprecation")
              public void onInitializeClient() {
                  ModuleManager.register(new KillAura());
                  ModuleManager.register(new Criticals());
                  ModuleManager.register(new AutoTotem());
                  ModuleManager.register(new Reach());
                  ModuleManager.register(new Velocity());

                  ModuleManager.register(new Fly());
                  ModuleManager.register(new Speed());
                  ModuleManager.register(new Sprint());
                  ModuleManager.register(new Step());
                  ModuleManager.register(new NoFall());
                  ModuleManager.register(new SafeWalk());
                  ModuleManager.register(new AutoJump());

                  ModuleManager.register(new Xray());
                  ModuleManager.register(new Fullbright());
                  ESP esp = new ESP();
                  ModuleManager.register(esp);
                  Tracers tracers = new Tracers();
                  ModuleManager.register(tracers);
                  Nametags nametags = new Nametags();
                  ModuleManager.register(nametags);
                  Hud hud = new Hud();
                  ModuleManager.register(hud);

                  ModuleManager.register(new AutoTool());
                  ModuleManager.register(new FastPlace());
                  ModuleManager.register(new FastBreak());

                  ModuleManager.register(new Timer());
                  ModuleManager.register(new AntiAFK());
                  ChatSuffix chatSuffix = new ChatSuffix();
                  ModuleManager.register(chatSuffix);

                  SettingManager.load();

                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.open_gui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          KEY_CATEGORY
                  ));

                  cycleModuleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.cycle_module",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_CONTROL,
                          KEY_CATEGORY
                  ));

                  HudRenderCallback.EVENT.register((drawContext, renderTickCounter) -> {
                      if (esp.isEnabled()) {
                          esp.renderOverlay(drawContext);
                      }
                      if (tracers.isEnabled()) {
                          tracers.renderOverlay(drawContext);
                      }
                      if (nametags.isEnabled()) {
                          nametags.renderOverlay(drawContext);
                      }
                      hud.renderHud(drawContext);
                  });

                  ClientSendMessageEvents.MODIFY_CHAT.register(chatSuffix::modifyMessage);

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openGuiKey.wasPressed()) {
                          if (client.currentScreen instanceof ClickGui) {
                              client.setScreen(null);
                          } else {
                              client.setScreen(new ClickGui());
                          }
                      }
                      while (cycleModuleKey.wasPressed()) {
                          ModuleManager.cycle();
                      }
                      if (client.player != null && client.world != null) {
                          for (Module m : ModuleManager.all()) {
                              if (m.getKeyBind() != GLFW.GLFW_KEY_UNKNOWN
                                      && InputUtil.isKeyPressed(client.getWindow(), m.getKeyBind())
                                      && client.currentScreen == null) {
                                  if (!m.wasKeyPressedLastTick()) {
                                      m.setKeyPressedLastTick(true);
                                      m.toggle();
                                  }
                              } else {
                                  m.setKeyPressedLastTick(false);
                              }
                          }
                          ModuleManager.tickAll(client);
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/Category.java
          package bench.client.core;

          public enum Category {
              COMBAT,
              MOVEMENT,
              RENDER,
              PLAYER,
              MISC
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/Setting.java
          package bench.client.core;

          public abstract class Setting<T> {
              private final String name;
              protected T value;

              public Setting(String name, T defaultValue) {
                  this.name = name;
                  this.value = defaultValue;
              }

              public String getName() {
                  return name;
              }

              public T getValue() {
                  return value;
              }

              public void setValue(T value) {
                  this.value = value;
                  SettingManager.save();
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/BoolSetting.java
          package bench.client.core;

          public class BoolSetting extends Setting<Boolean> {
              public BoolSetting(String name, boolean defaultValue) {
                  super(name, defaultValue);
              }

              public void toggle() {
                  setValue(!getValue());
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/DoubleSetting.java
          package bench.client.core;

          public class DoubleSetting extends Setting<Double> {
              private final double min;
              private final double max;

              public DoubleSetting(String name, double defaultValue, double min, double max) {
                  super(name, clamp(defaultValue, min, max));
                  this.min = min;
                  this.max = max;
              }

              @Override
              public void setValue(Double value) {
                  super.setValue(clamp(value, min, max));
              }

              public double getMin() {
                  return min;
              }

              public double getMax() {
                  return max;
              }

              private static double clamp(double val, double min, double max) {
                  return Math.max(min, Math.min(max, val));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/IntSetting.java
          package bench.client.core;

          public class IntSetting extends Setting<Integer> {
              private final int min;
              private final int max;

              public IntSetting(String name, int defaultValue, int min, int max) {
                  super(name, clamp(defaultValue, min, max));
                  this.min = min;
                  this.max = max;
              }

              @Override
              public void setValue(Integer value) {
                  super.setValue(clamp(value, min, max));
              }

              public int getMin() {
                  return min;
              }

              public int getMax() {
                  return max;
              }

              private static int clamp(int val, int min, int max) {
                  return Math.max(min, Math.min(max, val));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/EnumSetting.java
          package bench.client.core;

          public class EnumSetting<E extends Enum<E>> extends Setting<E> {
              private final E[] values;

              public EnumSetting(String name, E defaultValue) {
                  super(name, defaultValue);
                  this.values = defaultValue.getDeclaringClass().getEnumConstants();
              }

              public E[] getValues() {
                  return values;
              }

              public void cycle() {
                  int next = (getValue().ordinal() + 1) % values.length;
                  setValue(values[next]);
              }

              public void setByName(String name) {
                  for (E constant : values) {
                      if (constant.name().equalsIgnoreCase(name)) {
                          setValue(constant);
                          return;
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/Module.java
          package bench.client.core;

          import net.minecraft.client.MinecraftClient;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          public abstract class Module {
              private final String name;
              private final Category category;
              private boolean enabled;
              private int keyBind;
              private boolean keyPressedLastTick;
              private final List<Setting<?>> settings = new ArrayList<>();

              public Module(String name, Category category) {
                  this(name, category, GLFW.GLFW_KEY_UNKNOWN);
              }

              public Module(String name, Category category, int keyBind) {
                  this.name = name;
                  this.category = category;
                  this.keyBind = keyBind;
              }

              public String getName() {
                  return name;
              }

              public Category getCategory() {
                  return category;
              }

              public boolean isEnabled() {
                  return enabled;
              }

              public void setEnabled(boolean enabled) {
                  if (this.enabled != enabled) {
                      this.enabled = enabled;
                      if (enabled) {
                          onEnable();
                      } else {
                          onDisable();
                      }
                      SettingManager.save();
                  }
              }

              public void toggle() {
                  setEnabled(!enabled);
              }

              public int getKeyBind() {
                  return keyBind;
              }

              public void setKeyBind(int keyBind) {
                  this.keyBind = keyBind;
              }

              public boolean wasKeyPressedLastTick() {
                  return keyPressedLastTick;
              }

              public void setKeyPressedLastTick(boolean keyPressedLastTick) {
                  this.keyPressedLastTick = keyPressedLastTick;
              }

              public List<Setting<?>> getSettings() {
                  return settings;
              }

              protected <T extends Setting<?>> T add(T setting) {
                  settings.add(setting);
                  return setting;
              }

              public void onEnable() {
              }

              public void onDisable() {
              }

              public abstract void onTick(MinecraftClient client);
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/ModuleManager.java
          package bench.client.core;

          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public final class ModuleManager {
              private static final List<Module> MODULES = new ArrayList<>();
              private static int cycleIndex = 0;

              private ModuleManager() {
              }

              public static void register(Module module) {
                  MODULES.add(module);
              }

              public static Module byName(String name) {
                  for (Module m : MODULES) {
                      if (m.getName().equalsIgnoreCase(name)) {
                          return m;
                      }
                  }
                  return null;
              }

              public static <T extends Module> T get(Class<T> clazz) {
                  for (Module m : MODULES) {
                      if (clazz.isInstance(m)) {
                          return clazz.cast(m);
                      }
                  }
                  return null;
              }

              public static List<Module> all() {
                  return Collections.unmodifiableList(MODULES);
              }

              public static List<Module> byCategory(Category category) {
                  List<Module> list = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m.getCategory() == category) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              public static void cycle() {
                  if (MODULES.isEmpty()) {
                      return;
                  }
                  Module m = MODULES.get(cycleIndex % MODULES.size());
                  m.toggle();
                  cycleIndex = (cycleIndex + 1) % MODULES.size();
              }

              public static void tickAll(MinecraftClient client) {
                  for (Module m : MODULES) {
                      if (m.isEnabled()) {
                          m.onTick(client);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/SettingManager.java
          package bench.client.core;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public final class SettingManager {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static boolean loading = false;

              private SettingManager() {
              }

              private static Path getConfigPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve("benchclient.json");
              }

              public static void load() {
                  Path path = getConfigPath();
                  if (!Files.exists(path)) {
                      save();
                      return;
                  }
                  loading = true;
                  try (Reader reader = Files.newBufferedReader(path)) {
                      JsonElement rootElement = JsonParser.parseReader(reader);
                      if (rootElement == null || !rootElement.isJsonObject()) {
                          return;
                      }
                      JsonObject root = rootElement.getAsJsonObject();
                      for (Module module : ModuleManager.all()) {
                          if (!root.has(module.getName())) {
                              continue;
                          }
                          JsonObject modObj = root.getAsJsonObject(module.getName());
                          if (modObj.has("enabled")) {
                              module.setEnabled(modObj.get("enabled").getAsBoolean());
                          }
                          if (modObj.has("settings") && modObj.get("settings").isJsonObject()) {
                              JsonObject settingsObj = modObj.getAsJsonObject("settings");
                              for (Setting<?> setting : module.getSettings()) {
                                  if (!settingsObj.has(setting.getName())) {
                                      continue;
                                  }
                                  JsonElement val = settingsObj.get(setting.getName());
                                  if (setting instanceof BoolSetting boolSetting) {
                                      boolSetting.setValue(val.getAsBoolean());
                                  } else if (setting instanceof DoubleSetting doubleSetting) {
                                      doubleSetting.setValue(val.getAsDouble());
                                  } else if (setting instanceof IntSetting intSetting) {
                                      intSetting.setValue(val.getAsInt());
                                  } else if (setting instanceof EnumSetting<?> enumSetting) {
                                      enumSetting.setByName(val.getAsString());
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      loading = false;
                  }
              }

              public static void save() {
                  if (loading) {
                      return;
                  }
                  Path path = getConfigPath();
                  JsonObject root = new JsonObject();
                  for (Module module : ModuleManager.all()) {
                      JsonObject modObj = new JsonObject();
                      modObj.addProperty("enabled", module.isEnabled());
                      JsonObject settingsObj = new JsonObject();
                      for (Setting<?> setting : module.getSettings()) {
                          if (setting instanceof BoolSetting b) {
                              settingsObj.addProperty(b.getName(), b.getValue());
                          } else if (setting instanceof DoubleSetting d) {
                              settingsObj.addProperty(d.getName(), d.getValue());
                          } else if (setting instanceof IntSetting i) {
                              settingsObj.addProperty(i.getName(), i.getValue());
                          } else if (setting instanceof EnumSetting<?> e) {
                              settingsObj.addProperty(e.getName(), e.getValue().name());
                          }
                      }
                      modObj.add("settings", settingsObj);
                      root.add(module.getName(), modObj);
                  }
                  try {
                      Files.createDirectories(path.getParent());
                      try (Writer writer = Files.newBufferedWriter(path)) {
                          GSON.toJson(root, writer);
                      }
                  } catch (IOException ignored) {
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/gui/ClickGui.java
          package bench.client.gui;

          import bench.client.core.BoolSetting;
          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.EnumSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import bench.client.core.Setting;
          import bench.client.core.SettingManager;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;

          import java.util.List;
          import java.util.Locale;

          public class ClickGui extends Screen {
              private static Category selectedCategory = Category.COMBAT;
              private static Module expandedModule = null;
              private static int panelX = 40;
              private static int panelY = 30;

              private final int panelWidth = 360;
              private final int headerHeight = 22;
              private boolean draggingPanel = false;
              private int dragOffsetX = 0;
              private int dragOffsetY = 0;
              private Setting<?> draggingSlider = null;

              public ClickGui() {
                  super(Text.literal("BenchClient ClickGUI"));
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  context.fill(0, 0, this.width, this.height, 0x70000000);

                  List<Module> modules = ModuleManager.byCategory(selectedCategory);
                  int bodyHeight = Math.max(modules.size() * 18 + 12, 160);

                  context.fill(panelX, panelY, panelX + panelWidth, panelY + headerHeight + bodyHeight, 0xE0181820);
                  context.fill(panelX, panelY, panelX + panelWidth, panelY + headerHeight, 0xFF282838);

                  int tabWidth = panelWidth / Category.values().length;
                  Category[] categories = Category.values();
                  for (int i = 0; i < categories.length; i++) {
                      Category cat = categories[i];
                      int tx = panelX + i * tabWidth;
                      int bgColor = (cat == selectedCategory) ? 0xFF3F51B5 : 0xFF242432;
                      context.fill(tx, panelY, tx + tabWidth - 1, panelY + headerHeight, bgColor);
                      context.drawCenteredTextWithShadow(this.textRenderer, cat.name(), tx + tabWidth / 2, panelY + 7, 0xFFFFFF);
                  }

                  int modX = panelX + 6;
                  int modY = panelY + headerHeight + 6;
                  int modWidth = 150;

                  for (Module mod : modules) {
                      int bg = mod.isEnabled() ? 0xFF3A7BD5 : 0xFF2A2A38;
                      context.fill(modX, modY, modX + modWidth, modY + 16, bg);
                      context.drawTextWithShadow(this.textRenderer, mod.getName(), modX + 5, modY + 4, 0xFFFFFF);
                      if (!mod.getSettings().isEmpty()) {
                          context.drawTextWithShadow(this.textRenderer, "+", modX + modWidth - 10, modY + 4, 0xCCCCCC);
                      }
                      modY += 18;
                  }

                  int settingsX = panelX + 166;
                  int settingsY = panelY + headerHeight + 6;
                  int settingsWidth = panelWidth - 172;

                  if (expandedModule != null && expandedModule.getCategory() == selectedCategory) {
                      context.drawTextWithShadow(this.textRenderer, expandedModule.getName() + " Settings", settingsX, settingsY, 0xFF80BFFF);
                      settingsY += 14;
                      for (Setting<?> setting : expandedModule.getSettings()) {
                          context.fill(settingsX, settingsY, settingsX + settingsWidth, settingsY + 18, 0xFF252534);
                          if (setting instanceof BoolSetting b) {
                              String label = b.getName() + ": " + (b.getValue() ? "ON" : "OFF");
                              int color = b.getValue() ? 0xFF55FF55 : 0xFFFF5555;
                              context.drawTextWithShadow(this.textRenderer, label, settingsX + 4, settingsY + 5, color);
                          } else if (setting instanceof EnumSetting<?> e) {
                              String label = e.getName() + ": " + e.getValue().name();
                              context.drawTextWithShadow(this.textRenderer, label, settingsX + 4, settingsY + 5, 0xFFFFFF);
                          } else if (setting instanceof DoubleSetting d) {
                              double pct = (d.getValue() - d.getMin()) / (d.getMax() - d.getMin());
                              int fillW = (int) (settingsWidth * Math.max(0.0, Math.min(1.0, pct)));
                              context.fill(settingsX, settingsY, settingsX + fillW, settingsY + 18, 0xFF3F51B5);
                              String label = String.format(Locale.ROOT, "%s: %.2f", d.getName(), d.getValue());
                              context.drawTextWithShadow(this.textRenderer, label, settingsX + 4, settingsY + 5, 0xFFFFFF);
                          } else if (setting instanceof IntSetting i) {
                              double pct = (double) (i.getValue() - i.getMin()) / Math.max(1, i.getMax() - i.getMin());
                              int fillW = (int) (settingsWidth * Math.max(0.0, Math.min(1.0, pct)));
                              context.fill(settingsX, settingsY, settingsX + fillW, settingsY + 18, 0xFF3F51B5);
                              String label = i.getName() + ": " + i.getValue();
                              context.drawTextWithShadow(this.textRenderer, label, settingsX + 4, settingsY + 5, 0xFFFFFF);
                          }
                          settingsY += 20;
                      }
                  }
              }

              @Override
              public boolean mouseClicked(Click click, boolean bl) {
                  double mouseX = click.x();
                  double mouseY = click.y();
                  int button = click.button();

                  int tabWidth = panelWidth / Category.values().length;
                  if (mouseX >= panelX && mouseX <= panelX + panelWidth && mouseY >= panelY && mouseY <= panelY + headerHeight) {
                      if (button == 0) {
                          int idx = (int) ((mouseX - panelX) / tabWidth);
                          Category[] cats = Category.values();
                          if (idx >= 0 && idx < cats.length) {
                              selectedCategory = cats[idx];
                              expandedModule = null;
                          }
                          draggingPanel = true;
                          dragOffsetX = (int) mouseX - panelX;
                          dragOffsetY = (int) mouseY - panelY;
                          return true;
                      }
                  }

                  List<Module> modules = ModuleManager.byCategory(selectedCategory);
                  int modX = panelX + 6;
                  int modY = panelY + headerHeight + 6;
                  int modWidth = 150;

                  for (Module mod : modules) {
                      if (mouseX >= modX && mouseX <= modX + modWidth && mouseY >= modY && mouseY <= modY + 16) {
                          if (button == 0) {
                              mod.toggle();
                          } else if (button == 1) {
                              expandedModule = mod;
                          }
                          return true;
                      }
                      modY += 18;
                  }

                  if (expandedModule != null && expandedModule.getCategory() == selectedCategory) {
                      int settingsX = panelX + 166;
                      int settingsY = panelY + headerHeight + 20;
                      int settingsWidth = panelWidth - 172;

                      for (Setting<?> setting : expandedModule.getSettings()) {
                          if (mouseX >= settingsX && mouseX <= settingsX + settingsWidth && mouseY >= settingsY && mouseY <= settingsY + 18) {
                              if (setting instanceof BoolSetting b) {
                                  b.toggle();
                              } else if (setting instanceof EnumSetting<?> e) {
                                  e.cycle();
                              } else if (setting instanceof DoubleSetting || setting instanceof IntSetting) {
                                  draggingSlider = setting;
                                  updateSliderValue(setting, mouseX, settingsX, settingsWidth);
                              }
                              return true;
                          }
                          settingsY += 20;
                      }
                  }

                  return super.mouseClicked(click, bl);
              }

              @Override
              public boolean mouseDragged(Click click, double deltaX, double deltaY) {
                  double mouseX = click.x();
                  double mouseY = click.y();
                  if (draggingPanel) {
                      panelX = (int) mouseX - dragOffsetX;
                      panelY = (int) mouseY - dragOffsetY;
                      return true;
                  }
                  if (draggingSlider != null) {
                      int settingsX = panelX + 166;
                      int settingsWidth = panelWidth - 172;
                      updateSliderValue(draggingSlider, mouseX, settingsX, settingsWidth);
                      return true;
                  }
                  return super.mouseDragged(click, deltaX, deltaY);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  draggingPanel = false;
                  draggingSlider = null;
                  SettingManager.save();
                  return super.mouseReleased(click);
              }

              private void updateSliderValue(Setting<?> setting, double mouseX, int x, int width) {
                  double pct = Math.max(0.0, Math.min(1.0, (mouseX - x) / (double) width));
                  if (setting instanceof DoubleSetting d) {
                      double raw = d.getMin() + pct * (d.getMax() - d.getMin());
                      double rounded = Math.round(raw * 100.0) / 100.0;
                      d.setValue(rounded);
                  } else if (setting instanceof IntSetting i) {
                      int val = (int) Math.round(i.getMin() + pct * (i.getMax() - i.getMin()));
                      i.setValue(val);
                  }
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }
          }
