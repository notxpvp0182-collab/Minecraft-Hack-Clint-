          public class Speed extends Module {
              public final DoubleSetting mult = add(new DoubleSetting("Mult", 1.35, 1.0, 3.0));

              public Speed() {
                  super("Speed", Category.MOVEMENT);
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || !client.player.isOnGround()) {
                      return;
                  }
                  Vec2f move = client.player.input.getMovementInput();
                  if (move.x == 0.0f && move.y == 0.0f) {
                      return;
                  }
                  Vec3d vel = client.player.getVelocity();
                  double curSpeed = Math.hypot(vel.x, vel.z);
                  double maxSpeed = 0.28 * mult.getValue();
                  if (curSpeed < maxSpeed) {
                      double boost = Math.min(mult.getValue(), 1.28);
                      client.player.setVelocity(vel.x * boost, vel.y, vel.z * boost);
                  }
              }
          }
