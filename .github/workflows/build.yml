          cat << 'EOF' > src/main/java/bench/client/core/EnumSetting.java
          package bench.client.core;

          public class EnumSetting<E extends Enum<E>> extends Setting<E> {
              private final E[] values;

              public EnumSetting(String name, E defaultValue) {
                  super(name, defaultValue);
                  this.values = defaultValue.getDeclaringClass().getEnumConstants();
              }

              public E[] getValues() {
                  return values;
              }

              public void cycle() {
                  int next = (getValue().ordinal() + 1) % values.length;
                  setValue(values[next]);
              }

              public void setByName(String name) {
                  for (E constant : values) {
                      if (constant.name().equalsIgnoreCase(name)) {
                          setValue(constant);
                          return;
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/KeybindSetting.java
          package bench.client.core;

          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class KeybindSetting extends Setting<Integer> {
              public KeybindSetting(String name, int defaultKeyCode) {
                  super(name, defaultKeyCode);
              }

              public String getKeyName() {
                  int code = getValue();
                  if (code == GLFW.GLFW_KEY_UNKNOWN || code <= 0) {
                      return "NONE";
                  }
                  try {
                      return InputUtil.Type.KEYSYM.createFromCode(code).getLocalizedText().getString().toUpperCase();
                  } catch (Exception e) {
                      return "KEY_" + code;
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/Module.java
          package bench.client.core;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          public abstract class Module {
              private final String name;
              private final Category category;
              private boolean enabled;
              private int keyBind;
              private boolean keyPressedLastTick;
              private final List<Setting<?>> settings = new ArrayList<>();

              public Module(String name, Category category) {
                  this(name, category, GLFW.GLFW_KEY_UNKNOWN);
              }

              public Module(String name, Category category, int keyBind) {
                  this.name = name;
                  this.category = category;
                  this.keyBind = keyBind;
              }

              public String getName() {
                  return name;
              }

              public Category getCategory() {
                  return category;
              }

              public boolean isEnabled() {
                  return enabled;
              }

              public void setEnabled(boolean enabled) {
                  if (this.enabled != enabled) {
                      this.enabled = enabled;
                      if (enabled) {
                          onEnable();
                      } else {
                          onDisable();
                      }
                      SettingManager.save();
                  }
              }

              public void toggle() {
                  setEnabled(!enabled);
              }

              public int getKeyBind() {
                  return keyBind;
              }

              public void setKeyBind(int keyBind) {
                  this.keyBind = keyBind;
                  SettingManager.save();
              }

              public String getKeyBindName() {
                  if (keyBind == GLFW.GLFW_KEY_UNKNOWN || keyBind <= 0) {
                      return "NONE";
                  }
                  try {
                      return InputUtil.Type.KEYSYM.createFromCode(keyBind).getLocalizedText().getString().toUpperCase();
                  } catch (Exception e) {
                      return "KEY_" + keyBind;
                  }
              }

              public boolean wasKeyPressedLastTick() {
                  return keyPressedLastTick;
              }

              public void setKeyPressedLastTick(boolean keyPressedLastTick) {
                  this.keyPressedLastTick = keyPressedLastTick;
              }

              public List<Setting<?>> getSettings() {
                  return settings;
              }

              protected <T extends Setting<?>> T add(T setting) {
                  settings.add(setting);
                  return setting;
              }

              public void onEnable() {
              }

              public void onDisable() {
              }

              public abstract void onTick(MinecraftClient client);
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/ModuleManager.java
          package bench.client.core;

          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public final class ModuleManager {
              private static final List<Module> MODULES = new ArrayList<>();
              private static int cycleIndex = 0;

              private ModuleManager() {
              }

              public static void register(Module module) {
                  MODULES.add(module);
              }

              public static Module byName(String name) {
                  for (Module m : MODULES) {
                      if (m.getName().equalsIgnoreCase(name)) {
                          return m;
                      }
                  }
                  return null;
              }

              public static <T extends Module> T get(Class<T> clazz) {
                  for (Module m : MODULES) {
                      if (clazz.isInstance(m)) {
                          return clazz.cast(m);
                      }
                  }
                  return null;
              }

              public static List<Module> all() {
                  return Collections.unmodifiableList(MODULES);
              }

              public static List<Module> byCategory(Category category) {
                  List<Module> list = new ArrayList<>();
                  for (Module m : MODULES) {
                      if (m.getCategory() == category) {
                          list.add(m);
                      }
                  }
                  return list;
              }

              public static void cycle() {
                  if (MODULES.isEmpty()) {
                      return;
                  }
                  Module m = MODULES.get(cycleIndex % MODULES.size());
                  m.toggle();
                  cycleIndex = (cycleIndex + 1) % MODULES.size();
              }

              public static void tickAll(MinecraftClient client) {
                  for (Module m : MODULES) {
                      if (m.isEnabled()) {
                          m.onTick(client);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/SettingManager.java
          package bench.client.core;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public final class SettingManager {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static boolean loading = false;

              private SettingManager() {
              }

              private static Path getConfigPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve("benchclient.json");
              }

              public static void load() {
                  Path path = getConfigPath();
                  if (!Files.exists(path)) {
                      save();
                      return;
                  }
                  loading = true;
                  try (Reader reader = Files.newBufferedReader(path)) {
                      JsonElement rootElement = JsonParser.parseReader(reader);
                      if (rootElement == null || !rootElement.isJsonObject()) {
                          return;
                      }
                      JsonObject root = rootElement.getAsJsonObject();
                      for (Module module : ModuleManager.all()) {
                          if (!root.has(module.getName())) {
                              continue;
                          }
                          JsonObject modObj = root.getAsJsonObject(module.getName());
                          if (modObj.has("enabled")) {
                              module.setEnabled(modObj.get("enabled").getAsBoolean());
                          }
                          if (modObj.has("keyBind")) {
                              module.setKeyBind(modObj.get("keyBind").getAsInt());
                          }
                          if (modObj.has("settings") && modObj.get("settings").isJsonObject()) {
                              JsonObject settingsObj = modObj.getAsJsonObject("settings");
                              for (Setting<?> setting : module.getSettings()) {
                                  if (!settingsObj.has(setting.getName())) {
                                      continue;
                                  }
                                  JsonElement val = settingsObj.get(setting.getName());
                                  if (setting instanceof BoolSetting boolSetting) {
                                      boolSetting.setValue(val.getAsBoolean());
                                  } else if (setting instanceof DoubleSetting doubleSetting) {
                                      doubleSetting.setValue(val.getAsDouble());
                                  } else if (setting instanceof IntSetting intSetting) {
                                      intSetting.setValue(val.getAsInt());
                                  } else if (setting instanceof KeybindSetting keybindSetting) {
                                      keybindSetting.setValue(val.getAsInt());
                                  } else if (setting instanceof EnumSetting<?> enumSetting) {
                                      enumSetting.setByName(val.getAsString());
                                  }
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      loading = false;
                  }
              }

              public static void save() {
                  if (loading) {
                      return;
                  }
                  Path path = getConfigPath();
                  JsonObject root = new JsonObject();
                  for (Module module : ModuleManager.all()) {
                      JsonObject modObj = new JsonObject();
                      modObj.addProperty("enabled", module.isEnabled());
                      modObj.addProperty("keyBind", module.getKeyBind());
                      JsonObject settingsObj = new JsonObject();
                      for (Setting<?> setting : module.getSettings()) {
                          if (setting instanceof BoolSetting b) {
                              settingsObj.addProperty(b.getName(), b.getValue());
                          } else if (setting instanceof DoubleSetting d) {
                              settingsObj.addProperty(d.getName(), d.getValue());
                          } else if (setting instanceof IntSetting i) {
                              settingsObj.addProperty(i.getName(), i.getValue());
                          } else if (setting instanceof KeybindSetting k) {
                              settingsObj.addProperty(k.getName(), k.getValue());
                          } else if (setting instanceof EnumSetting<?> e) {
                              settingsObj.addProperty(e.getName(), e.getValue().name());
                          }
                      }
                      modObj.add("settings", settingsObj);
                      root.add(module.getName(), modObj);
                  }
                  try {
                      Files.createDirectories(path.getParent());
                      try (Writer writer = Files.newBufferedWriter(path)) {
                          GSON.toJson(root, writer);
                      }
                  } catch (IOException ignored) {
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/gui/ClickGui.java
          package bench.client.gui;

          import bench.client.core.BoolSetting;
          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.EnumSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.KeybindSetting;
          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import bench.client.core.Setting;
          import bench.client.core.SettingManager;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.input.KeyInput;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.EnumMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class ClickGui extends Screen {
              private static final Map<Category, int[]> WINDOW_POS = new EnumMap<>(Category.class);
              private static final Map<Category, Boolean> WINDOW_COLLAPSED = new EnumMap<>(Category.class);
              private static Module selectedModule = null;
              private static int inspectorX = -1;
              private static int inspectorY = 26;

              static {
                  Category[] cats = Category.values();
                  for (int i = 0; i < cats.length; i++) {
                      WINDOW_POS.put(cats[i], new int[]{10 + i * 96, 26});
                      WINDOW_COLLAPSED.put(cats[i], false);
                  }
              }

              private static final int COL_WIDTH = 90;
              private static final int HEADER_HEIGHT = 16;
              private static final int MOD_HEIGHT = 15;
              private static final int INSPECTOR_WIDTH = 175;

              private Category draggingCategory = null;
              private boolean draggingInspector = false;
              private int dragOffsetX = 0;
              private int dragOffsetY = 0;
              private Setting<?> draggingSlider = null;

              private Module listeningModuleBind = null;
              private KeybindSetting listeningSettingBind = null;

              public ClickGui() {
                  super(Text.literal("BenchClient Wurst GUI"));
              }

              @Override
              protected void init() {
                  if (inspectorX < 0 || inspectorX > this.width - 60) {
                      inspectorX = Math.max(10, this.width - INSPECTOR_WIDTH - 10);
                  }
                  if (selectedModule == null) {
                      selectedModule = ModuleManager.byName("AutoFight");
                  }
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  context.fill(0, 0, this.width, this.height, 0x8808080C);

                  context.fill(0, 0, this.width, 20, 0xEE14141E);
                  context.fill(0, 19, this.width, 20, 0xFFFF8800);
                  context.drawTextWithShadow(
                          this.textRenderer,
                          "BenchClient v2.0 (1.21.11) | Left-Click: Toggle | Right-Click or [+]: Settings & Keybind",
                          8,
                          6,
                          0xFFFFFFFF
                  );

                  for (Category cat : Category.values()) {
                      int[] pos = WINDOW_POS.get(cat);
                      int wx = pos[0];
                      int wy = pos[1];
                      boolean collapsed = WINDOW_COLLAPSED.getOrDefault(cat, false);
                      List<Module> modules = ModuleManager.byCategory(cat);

                      context.fill(wx, wy, wx + COL_WIDTH, wy + HEADER_HEIGHT, 0xFF232332);
                      context.fill(wx, wy, wx + COL_WIDTH, wy + 2, 0xFFFF8800);
                      context.drawTextWithShadow(this.textRenderer, cat.getTitle(), wx + 5, wy + 4, 0xFFFFFFFF);
                      context.drawTextWithShadow(
                              this.textRenderer,
                              collapsed ? "[+]" : "[-]",
                              wx + COL_WIDTH - 18,
                              wy + 4,
                              0xFFCCCCCC
                      );

                      if (collapsed) {
                          continue;
                      }

                      int bodyH = modules.size() * (MOD_HEIGHT + 1) + 4;
                      context.fill(wx, wy + HEADER_HEIGHT, wx + COL_WIDTH, wy + HEADER_HEIGHT + bodyH, 0xDD14141D);
                      drawBorder(context, wx, wy, COL_WIDTH, HEADER_HEIGHT + bodyH, 0xFF34344A);

                      int my = wy + HEADER_HEIGHT + 2;
                      for (Module mod : modules) {
                          boolean hovered = mouseX >= wx + 2 && mouseX <= wx + COL_WIDTH - 2
                                  && mouseY >= my && mouseY <= my + MOD_HEIGHT;
                          boolean enabled = mod.isEnabled();
                          boolean selected = (mod == selectedModule);

                          int bgColor;
                          if (enabled) {
                              bgColor = hovered ? 0xFF38B858 : 0xFF289644;
                          } else {
                              bgColor = hovered ? 0xFF36364C : 0xFF242434;
                          }

                          context.fill(wx + 2, my, wx + COL_WIDTH - 2, my + MOD_HEIGHT, bgColor);
                          if (selected) {
                              drawBorder(context, wx + 2, my, COL_WIDTH - 4, MOD_HEIGHT, 0xFFFFAA00);
                          }

                          context.drawTextWithShadow(
                                  this.textRenderer,
                                  mod.getName(),
                                  wx + 6,
                                  my + 4,
                                  enabled ? 0xFFFFFFFF : 0xFFE0E0E0
                          );

                          context.drawTextWithShadow(
                                  this.textRenderer,
                                  "+",
                                  wx + COL_WIDTH - 10,
                                  my + 4,
                                  selected ? 0xFFFFCC00 : 0xFFAAAAAA
                          );

                          my += MOD_HEIGHT + 1;
                      }
                  }

                  renderInspectorWindow(context, mouseX, mouseY);
              }

              private void renderInspectorWindow(DrawContext context, int mouseX, int mouseY) {
                  if (selectedModule == null) {
                      return;
                  }

                  List<Setting<?>> settings = selectedModule.getSettings();
                  int rows = 2 + settings.size();
                  int bodyH = rows * 21 + 10;

                  context.fill(inspectorX, inspectorY, inspectorX + INSPECTOR_WIDTH, inspectorY + HEADER_HEIGHT, 0xFF262638);
                  context.fill(inspectorX, inspectorY, inspectorX + INSPECTOR_WIDTH, inspectorY + 2, 0xFF00C8FF);
                  context.drawTextWithShadow(
                          this.textRenderer,
                          selectedModule.getName() + " Settings",
                          inspectorX + 6,
                          inspectorY + 4,
                          0xFFFFFFFF
                  );

                  context.fill(
                          inspectorX,
                          inspectorY + HEADER_HEIGHT,
                          inspectorX + INSPECTOR_WIDTH,
                          inspectorY + HEADER_HEIGHT + bodyH,
                          0xEE14141F
                  );
                  drawBorder(context, inspectorX, inspectorY, INSPECTOR_WIDTH, HEADER_HEIGHT + bodyH, 0xFF00C8FF);

                  int sx = inspectorX + 6;
                  int sy = inspectorY + HEADER_HEIGHT + 5;
                  int sw = INSPECTOR_WIDTH - 12;

                  int toggleBg = selectedModule.isEnabled() ? 0xFF289644 : 0xFF7A2828;
                  context.fill(sx, sy, sx + sw, sy + 18, toggleBg);
                  String stateTxt = "State: " + (selectedModule.isEnabled() ? "ENABLED" : "DISABLED");
                  context.drawTextWithShadow(this.textRenderer, stateTxt, sx + 5, sy + 5, 0xFFFFFFFF);
                  sy += 21;

                  boolean listeningMod = (listeningModuleBind == selectedModule);
                  int bindBg = listeningMod ? 0xFFD48800 : 0xFF2C2C42;
                  context.fill(sx, sy, sx + sw, sy + 18, bindBg);
                  String bindLabel = listeningMod
                          ? "Press Key... (ESC = Clear)"
                          : "Keybind: [" + selectedModule.getKeyBindName() + "]";
                  context.drawTextWithShadow(this.textRenderer, bindLabel, sx + 5, sy + 5, 0xFFFFEE55);
                  sy += 21;

                  for (Setting<?> setting : settings) {
                      context.fill(sx, sy, sx + sw, sy + 18, 0xFF242436);

                      if (setting instanceof BoolSetting b) {
                          int pillColor = b.getValue() ? 0xFF289644 : 0xFF882828;
                          context.fill(sx + sw - 34, sy + 2, sx + sw - 2, sy + 16, pillColor);
                          context.drawTextWithShadow(this.textRenderer, b.getName(), sx + 5, sy + 5, 0xFFFFFFFF);
                          context.drawTextWithShadow(
                                  this.textRenderer,
                                  b.getValue() ? "ON" : "OFF",
                                  sx + sw - 28,
                                  sy + 5,
                                  0xFFFFFFFF
                          );
                      } else if (setting instanceof EnumSetting<?> e) {
                          String label = e.getName() + ": " + e.getValue().name();
                          context.drawTextWithShadow(this.textRenderer, label, sx + 5, sy + 5, 0xFF80E5FF);
                      } else if (setting instanceof KeybindSetting k) {
                          boolean listeningK = (listeningSettingBind == k);
                          if (listeningK) {
                              context.fill(sx, sy, sx + sw, sy + 18, 0xFFD48800);
                          }
                          String kLabel = listeningK
                                  ? k.getName() + ": Press Key..."
                                  : k.getName() + ": [" + k.getKeyName() + "]";
                          context.drawTextWithShadow(this.textRenderer, kLabel, sx + 5, sy + 5, 0xFFFFCC44);
                      } else if (setting instanceof DoubleSetting d) {
                          double pct = (d.getValue() - d.getMin()) / (d.getMax() - d.getMin());
                          int fillW = (int) (sw * Math.max(0.0, Math.min(1.0, pct)));
                          context.fill(sx, sy, sx + fillW, sy + 18, 0xFF2A6FDB);
                          String label = String.format(Locale.ROOT, "%s: %.2f", d.getName(), d.getValue());
                          context.drawTextWithShadow(this.textRenderer, label, sx + 5, sy + 5, 0xFFFFFFFF);
                      } else if (setting instanceof IntSetting i) {
                          double pct = (double) (i.getValue() - i.getMin()) / Math.max(1, i.getMax() - i.getMin());
                          int fillW = (int) (sw * Math.max(0.0, Math.min(1.0, pct)));
                          context.fill(sx, sy, sx + fillW, sy + 18, 0xFF2A6FDB);
                          String label = i.getName() + ": " + i.getValue();
                          context.drawTextWithShadow(this.textRenderer, label, sx + 5, sy + 5, 0xFFFFFFFF);
                      }
                      sy += 21;
                  }
              }

              private void drawBorder(DrawContext ctx, int x, int y, int w, int h, int color) {
                  ctx.fill(x, y, x + w, y + 1, color);
                  ctx.fill(x, y + h - 1, x + w, y + h, color);
                  ctx.fill(x, y, x + 1, y + h, color);
                  ctx.fill(x + w - 1, y, x + w, y + h, color);
              }

              @Override
              public boolean mouseClicked(Click click, boolean bl) {
                  double mouseX = click.x();
                  double mouseY = click.y();
                  int button = click.button();

                  if (selectedModule != null) {
                      if (mouseX >= inspectorX && mouseX <= inspectorX + INSPECTOR_WIDTH
                              && mouseY >= inspectorY && mouseY <= inspectorY + HEADER_HEIGHT) {
                          if (button == 0) {
                              draggingInspector = true;
                              dragOffsetX = (int) mouseX - inspectorX;
                              dragOffsetY = (int) mouseY - inspectorY;
                              return true;
                          }
                      }

                      int sx = inspectorX + 6;
                      int sy = inspectorY + HEADER_HEIGHT + 5;
                      int sw = INSPECTOR_WIDTH - 12;

                      if (mouseX >= sx && mouseX <= sx + sw && mouseY >= sy && mouseY <= sy + 18) {
                          selectedModule.toggle();
                          return true;
                      }
                      sy += 21;

                      if (mouseX >= sx && mouseX <= sx + sw && mouseY >= sy && mouseY <= sy + 18) {
                          if (button == 1) {
                              selectedModule.setKeyBind(GLFW.GLFW_KEY_UNKNOWN);
                              listeningModuleBind = null;
                          } else {
                              listeningModuleBind = (listeningModuleBind == selectedModule) ? null : selectedModule;
                              listeningSettingBind = null;
                          }
                          return true;
                      }
                      sy += 21;

                      for (Setting<?> setting : selectedModule.getSettings()) {
                          if (mouseX >= sx && mouseX <= sx + sw && mouseY >= sy && mouseY <= sy + 18) {
                              listeningModuleBind = null;
                              if (setting instanceof BoolSetting b) {
                                  b.toggle();
                              } else if (setting instanceof EnumSetting<?> e) {
                                  e.cycle();
                              } else if (setting instanceof KeybindSetting k) {
                                  if (button == 1) {
                                      k.setValue(GLFW.GLFW_KEY_UNKNOWN);
                                      listeningSettingBind = null;
                                  } else {
                                      listeningSettingBind = (listeningSettingBind == k) ? null : k;
                                  }
                              } else if (setting instanceof DoubleSetting || setting instanceof IntSetting) {
                                  draggingSlider = setting;
                                  updateSliderValue(setting, mouseX, sx, sw);
                              }
                              return true;
                          }
                          sy += 21;
                      }
                  }

                  for (Category cat : Category.values()) {
                      int[] pos = WINDOW_POS.get(cat);
                      int wx = pos[0];
                      int wy = pos[1];

                      if (mouseX >= wx && mouseX <= wx + COL_WIDTH && mouseY >= wy && mouseY <= wy + HEADER_HEIGHT) {
                          if (button == 1 || mouseX >= wx + COL_WIDTH - 20) {
                              WINDOW_COLLAPSED.put(cat, !WINDOW_COLLAPSED.getOrDefault(cat, false));
                          } else if (button == 0) {
                              draggingCategory = cat;
                              dragOffsetX = (int) mouseX - wx;
                              dragOffsetY = (int) mouseY - wy;
                          }
                          return true;
                      }

                      if (WINDOW_COLLAPSED.getOrDefault(cat, false)) {
                          continue;
                      }

                      int my = wy + HEADER_HEIGHT + 2;
                      for (Module mod : ModuleManager.byCategory(cat)) {
                          if (mouseX >= wx + 2 && mouseX <= wx + COL_WIDTH - 2 && mouseY >= my && mouseY <= my + MOD_HEIGHT) {
                              if (button == 1 || mouseX >= wx + COL_WIDTH - 16) {
                                  selectedModule = mod;
                                  listeningModuleBind = null;
                                  listeningSettingBind = null;
                              } else if (button == 0) {
                                  mod.toggle();
                                  selectedModule = mod;
                              }
                              return true;
                          }
                          my += MOD_HEIGHT + 1;
                      }
                  }

                  return super.mouseClicked(click, bl);
              }

              @Override
              public boolean mouseDragged(Click click, double deltaX, double deltaY) {
                  double mouseX = click.x();
                  double mouseY = click.y();

                  if (draggingInspector) {
                      inspectorX = (int) mouseX - dragOffsetX;
                      inspectorY = (int) mouseY - dragOffsetY;
                      return true;
                  }
                  if (draggingCategory != null) {
                      int[] pos = WINDOW_POS.get(draggingCategory);
                      pos[0] = (int) mouseX - dragOffsetX;
                      pos[1] = (int) mouseY - dragOffsetY;
                      return true;
                  }
                  if (draggingSlider != null) {
                      int sx = inspectorX + 6;
                      int sw = INSPECTOR_WIDTH - 12;
                      updateSliderValue(draggingSlider, mouseX, sx, sw);
                      return true;
                  }
                  return super.mouseDragged(click, deltaX, deltaY);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  draggingCategory = null;
                  draggingInspector = false;
                  draggingSlider = null;
                  SettingManager.save();
                  return super.mouseReleased(click);
              }

              @Override
              public boolean keyPressed(KeyInput keyInput) {
                  int keyCode = keyInput.key();

                  if (listeningModuleBind != null) {
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_DELETE || keyCode == GLFW.GLFW_KEY_BACKSPACE) {
                          listeningModuleBind.setKeyBind(GLFW.GLFW_KEY_UNKNOWN);
                      } else {
                          listeningModuleBind.setKeyBind(keyCode);
                      }
                      listeningModuleBind = null;
                      SettingManager.save();
                      return true;
                  }

                  if (listeningSettingBind != null) {
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_DELETE || keyCode == GLFW.GLFW_KEY_BACKSPACE) {
                          listeningSettingBind.setValue(GLFW.GLFW_KEY_UNKNOWN);
                      } else {
                          listeningSettingBind.setValue(keyCode);
                      }
                      listeningSettingBind = null;
                      SettingManager.save();
                      return true;
                  }

                  return super.keyPressed(keyInput);
              }

              private void updateSliderValue(Setting<?> setting, double mouseX, int x, int width) {
                  double pct = Math.max(0.0, Math.min(1.0, (mouseX - x) / (double) width));
                  if (setting instanceof DoubleSetting d) {
                      double raw = d.getMin() + pct * (d.getMax() - d.getMin());
                      double rounded = Math.round(raw * 100.0) / 100.0;
                      d.setValue(rounded);
                  } else if (setting instanceof IntSetting i) {
                      int val = (int) Math.round(i.getMin() + pct * (i.getMax() - i.getMin()));
                      i.setValue(val);
                  }
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }
          }
