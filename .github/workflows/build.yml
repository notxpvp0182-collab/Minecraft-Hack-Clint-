                          Category.COMBAT,
                          "Renders an estimated landing indicator when holding a Bow, Crossbow, or Ender Pearl."
                  ) {
                      @Override
                      public void onRenderHud(DrawContext context) {
                          MinecraftClient client = MinecraftClient.getInstance();
                          if (client.player == null || client.world == null) {
                              return;
                          }
                          ItemStack main = client.player.getMainHandStack();
                          boolean isBow = main.getItem() instanceof BowItem || main.getItem() instanceof CrossbowItem;
                          boolean isPearl = main.getItem() instanceof EnderPearlItem;
                          if (!isBow && !isPearl) {
                              return;
                          }
                          double speed = isBow ? 3.0 : 1.5;
                          double gravity = isBow ? 0.05 : 0.03;
                          Vec3d pos = client.player.getEyePos();
                          Vec3d vel = Vec3d.fromPolar(client.player.getPitch(), client.player.getYaw()).multiply(speed);
                          for (int step = 0; step < 60; step++) {
                              pos = pos.add(vel);
                              vel = vel.multiply(0.99).subtract(0.0, gravity, 0.0);
                              BlockPos bp = BlockPos.ofFloored(pos);
                              if (!client.world.getBlockState(bp).isAir()) {
                                  break;
                              }
                          }
                          int[] screen = worldToScreen(context, pos);
                          if (screen != null) {
                              int sx = screen[0];
                              int sy = screen[1];
                              context.fill(sx - 4, sy - 4, sx + 4, sy + 4, 0xAA2563EB);
                              context.drawTextWithShadow(client.textRenderer, "Est. Impact", sx + 6, sy - 4, 0xFF93C5FD);
                          }
                      }
                  });

