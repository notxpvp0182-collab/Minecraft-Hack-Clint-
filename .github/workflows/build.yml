          package bench.client.modules.misc;

          import bench.client.core.Category;
          import bench.client.core.EnumSetting;
          import bench.client.core.IntSetting;
          import bench.client.core.Module;
          import net.minecraft.client.MinecraftClient;

          public class AntiAFK extends Module {
              public enum Mode {
                  ROTATE,
                  SNEAK,
                  BOTH
              }

              public final IntSetting interval = add(new IntSetting("Interval", 60, 10, 200));
              public final EnumSetting<Mode> mode = add(new EnumSetting<>("Mode", Mode.BOTH));

              private int ticks = 0;

              public AntiAFK() {
                  super("AntiAFK", Category.MISC);
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null) {
                      return;
                  }
                  ticks++;
                  if (ticks >= interval.getValue()) {
                      ticks = 0;
                      Mode m = mode.getValue();
                      if (m == Mode.ROTATE || m == Mode.BOTH) {
                          client.player.setYaw(client.player.getYaw() + 25.0f);
                      }
                      if (m == Mode.SNEAK || m == Mode.BOTH) {
                          client.options.sneakKey.setPressed(!client.options.sneakKey.isPressed());
                      }
                  }
              }

              @Override
              public void onDisable() {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.options != null) {
                      client.options.sneakKey.setPressed(false);
                  }
              }
          }
