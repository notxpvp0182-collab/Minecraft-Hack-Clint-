                              winY + 11,
                              selected ? 0xFF3B82F6 : 0xFF94A3B8
                      );
                      if (selected) {
                          ctx.fill(catX, winY + topBarH - 2, catX + tabW - 6, winY + topBarH, 0xFF2563EB);
                      }
                      catX += tabW;
                  }

                  ctx.drawTextWithShadow(this.textRenderer, "X", winX + winW - 14, winY + 10, 0xFF94A3B8);

                  // 3. Content Split: Middle Modules List + Right Settings Inspector
                  int contentX = winX + sidebarW + 8;
                  int contentY = winY + topBarH + 8;
                  int contentW = winW - sidebarW - 16;
                  int contentH = winH - topBarH - 16;

                  if (activeSidebar == SidebarTab.PROFILES) {
                      renderProfilesPanel(ctx, contentX, contentY, contentW, contentH);
                  } else {
                      int listW = Math.max(150, (int) (contentW * 0.42));
                      int inspectorX = contentX + listW + 8;
                      int inspectorW = contentW - listW - 8;

                      renderModuleListColumn(ctx, contentX, contentY, listW, contentH);
                      renderSettingsInspectorColumn(ctx, inspectorX, contentY, inspectorW, contentH);
                  }

                  // Bottom-right Resize Grip
                  ctx.fill(winX + winW - 8, winY + winH - 2, winX + winW - 2, winY + winH - 1, 0xFF3B82F6);
                  ctx.fill(winX + winW - 2, winY + winH - 8, winX + winW - 1, winY + winH - 2, 0xFF3B82F6);
              }

              private void renderModuleListColumn(DrawContext ctx, int x, int y, int w, int h) {
                  ctx.fill(x, y, x + w, y + h, 0xFF0D1322);
                  drawRectBorder(ctx, x, y, w, h, 0xFF1E293B);

                  ctx.drawTextWithShadow(this.textRenderer, "Modules", x + 8, y + 7, 0xFFFFFFFF);

                  // Search Box
                  int sbX = x + 6;
                  int sbY = y + 19;
                  int sbW = w - 12;
                  ctx.fill(sbX, sbY, sbX + sbW, sbY + 16, 0xFF090D16);
                  drawRectBorder(ctx, sbX, sbY, sbW, 16, searchFocused ? 0xFF2563EB : 0xFF1E293B);
                  String qDisplay = searchQuery.isEmpty() && !searchFocused
                          ? "Search modules..."
                          : searchQuery + (searchFocused ? "_" : "");
                  ctx.drawTextWithShadow(
                          this.textRenderer,
                          qDisplay,
                          sbX + 5,
                          sbY + 4,
                          searchQuery.isEmpty() && !searchFocused ? 0xFF64748B : 0xFFFFFFFF
                  );

                  List<Module> modules = getVisibleModules();
                  int rowY = y + 40;
                  int maxRows = Math.max(1, (h - 44) / 28);
                  int startIdx = Math.max(0, Math.min(scrollOffset, Math.max(0, modules.size() - maxRows)));

                  for (int i = startIdx; i < Math.min(modules.size(), startIdx + maxRows); i++) {
                      Module mod = modules.get(i);
                      boolean isSelected = (mod == selectedModule);
                      int cardBg = isSelected ? 0xFF172554 : 0xFF111827;
                      ctx.fill(x + 6, rowY, x + w - 6, rowY + 25, cardBg);
                      if (isSelected) {
                          drawRectBorder(ctx, x + 6, rowY, w - 12, 25, 0xFF2563EB);
                      }

                      // Favorite Star
                      ctx.drawTextWithShadow(
                              this.textRenderer,
                              mod.isFavorite() ? "★" : "☆",
                              x + 10,
                              rowY + 5,
                              mod.isFavorite() ? 0xFFFBBF24 : 0xFF64748B
                      );

                      // Module Name + Category Subtitle
                      ctx.drawTextWithShadow(this.textRenderer, mod.getName(), x + 22, rowY + 4, 0xFFFFFFFF);
                      ctx.drawTextWithShadow(this.textRenderer, mod.getCategory().getTitle(), x + 22, rowY + 14, 0xFF3B82F6);

                      // Eternal Pill Toggle Switch
                      drawPillSwitch(ctx, x + w - 32, rowY + 7, mod.isEnabled());
                      rowY += 28;
                  }
              }

              private void renderSettingsInspectorColumn(DrawContext ctx, int x, int y, int w, int h) {
                  ctx.fill(x, y, x + w, y + h, 0xFF0D1322);
                  drawRectBorder(ctx, x, y, w, h, 0xFF1E293B);

                  if (selectedModule == null) {
                      ctx.drawTextWithShadow(this.textRenderer, "Select a module", x + 12, y + 12, 0xFF94A3B8);
                      return;
                  }

                  // Header: Module Title + Category + Top-Right Pill Switch
                  ctx.drawTextWithShadow(this.textRenderer, selectedModule.getName(), x + 10, y + 8, 0xFFFFFFFF);
                  ctx.drawTextWithShadow(this.textRenderer, selectedModule.getCategory().getTitle(), x + 10, y + 18, 0xFF3B82F6);
                  drawPillSwitch(ctx, x + w - 32, y + 10, selectedModule.isEnabled());

                  // Description Text
                  String desc = selectedModule.getDescription();
                  String line1 = desc.length() > 46 ? desc.substring(0, 46) : desc;
                  String line2 = desc.length() > 46 ? desc.substring(46, Math.min(desc.length(), 92)) : "";
                  ctx.drawTextWithShadow(this.textRenderer, line1, x + 10, y + 31, 0xFF94A3B8);
                  if (!line2.isEmpty()) {
                      ctx.drawTextWithShadow(this.textRenderer, line2, x + 10, y + 40, 0xFF94A3B8);
                  }

                  ctx.fill(x + 8, y + 51, x + w - 8, y + 52, 0xFF1E293B);
                  ctx.drawTextWithShadow(this.textRenderer, "Settings", x + 10, y + 56, 0xFFFFFFFF);

                  int sy = y + 69;

                  // Keybind Row with Conflict Detection
                  List<Module> conflicts = ModuleManager.findKeybindConflicts(selectedModule.getKeyBind(), selectedModule);
                  boolean listening = (listeningModuleBind == selectedModule);
                  ctx.fill(x + 8, sy, x + w - 8, sy + 20, 0xFF111827);
                  String kbTitle = conflicts.isEmpty() ? "Keybind" : "Keybind (Conflict!)";
                  ctx.drawTextWithShadow(this.textRenderer, kbTitle, x + 12, sy + 6, conflicts.isEmpty() ? 0xFFFFFFFF : 0xFFEF4444);

                  String kbVal = listening ? "Press Key..." : "[" + selectedModule.getKeyBindName() + "]";
                  int boxW = Math.max(54, this.textRenderer.getWidth(kbVal) + 10);
                  ctx.fill(x + w - boxW - 12, sy + 3, x + w - 12, sy + 17, listening ? 0xFF2563EB : 0xFF090D16);
                  drawRectBorder(ctx, x + w - boxW - 12, sy + 3, boxW, 14, 0xFF1E293B);
                  ctx.drawCenteredTextWithShadow(this.textRenderer, kbVal, x + w - 12 - boxW / 2, sy + 6, 0xFFFFFFFF);
                  sy += 23;

                  // Module Settings Rows
                  for (Setting<?> setting : selectedModule.getSettings()) {
                      if (sy + 22 > y + h - 4) {
                          break;
                      }
                      ctx.fill(x + 8, sy, x + w - 8, sy + 22, 0xFF111827);
                      ctx.drawTextWithShadow(this.textRenderer, setting.getName(), x + 12, sy + 4, 0xFFFFFFFF);
                      if (!setting.getDescription().isEmpty()) {
                          String sd = setting.getDescription();
                          if (sd.length() > 32) sd = sd.substring(0, 32) + "...";
                          ctx.drawTextWithShadow(this.textRenderer, sd, x + 12, sy + 13, 0xFF64748B);
                      }

                      int ctrlX = x + w - 78;
                      int ctrlW = 66;

                      if (setting instanceof BoolSetting b) {
                          drawPillSwitch(ctx, x + w - 32, sy + 6, b.getValue());
                      } else if (setting instanceof EnumSetting<?> e) {
                          ctx.fill(ctrlX, sy + 4, ctrlX + ctrlW, sy + 18, 0xFF090D16);
                          drawRectBorder(ctx, ctrlX, sy + 4, ctrlW, 14, 0xFF1E293B);
                          ctx.drawTextWithShadow(this.textRenderer, e.getValue().name(), ctrlX + 4, sy + 7, 0xFF93C5FD);
                      } else if (setting instanceof KeybindSetting k) {
                          boolean kListen = (listeningSettingBind == k);
                          ctx.fill(ctrlX, sy + 4, ctrlX + ctrlW, sy + 18, kListen ? 0xFF2563EB : 0xFF090D16);
                          drawRectBorder(ctx, ctrlX, sy + 4, ctrlW, 14, 0xFF1E293B);
                          String kTxt = kListen ? "Press..." : k.getKeyName();
                          ctx.drawCenteredTextWithShadow(this.textRenderer, kTxt, ctrlX + ctrlW / 2, sy + 7, 0xFFFFFFFF);
                      } else if (setting instanceof DoubleSetting d) {
                          ctx.fill(ctrlX, sy + 4, ctrlX + ctrlW, sy + 18, 0xFF090D16);
                          double pct = (d.getValue() - d.getMin()) / (d.getMax() - d.getMin());
                          int fill = (int) (ctrlW * Math.max(0.0, Math.min(1.0, pct)));
                          ctx.fill(ctrlX, sy + 16, ctrlX + fill, sy + 18, 0xFF2563EB);
                          drawRectBorder(ctx, ctrlX, sy + 4, ctrlW, 14, 0xFF1E293B);
                          String valStr = String.format(Locale.ROOT, "%.1f", d.getValue());
                          ctx.drawTextWithShadow(this.textRenderer, valStr, ctrlX + 5, sy + 7, 0xFFFFFFFF);
                          ctx.drawTextWithShadow(this.textRenderer, "▴▾", ctrlX + ctrlW - 14, sy + 7, 0xFF94A3B8);
                      } else if (setting instanceof IntSetting i) {
                          ctx.fill(ctrlX, sy + 4, ctrlX + ctrlW, sy + 18, 0xFF090D16);
                          double pct = (double) (i.getValue() - i.getMin()) / Math.max(1, i.getMax() - i.getMin());
                          int fill = (int) (ctrlW * Math.max(0.0, Math.min(1.0, pct)));
                          ctx.fill(ctrlX, sy + 16, ctrlX + fill, sy + 18, 0xFF2563EB);
                          drawRectBorder(ctx, ctrlX, sy + 4, ctrlW, 14, 0xFF1E293B);
                          ctx.drawTextWithShadow(this.textRenderer, Integer.toString(i.getValue()), ctrlX + 5, sy + 7, 0xFFFFFFFF);
                          ctx.drawTextWithShadow(this.textRenderer, "▴▾", ctrlX + ctrlW - 14, sy + 7, 0xFF94A3B8);
                      }
                      sy += 24;
                  }
              }

              private void renderProfilesPanel(DrawContext ctx, int x, int y, int w, int h) {
                  ctx.fill(x, y, x + w, y + h, 0xFF0D1322);
                  drawRectBorder(ctx, x, y, w, h, 0xFF1E293B);
                  ctx.drawTextWithShadow(this.textRenderer, "Configuration Profiles (Auto-Saved to Disk)", x + 12, y + 10, 0xFFFFFFFF);

                  int py = y + 30;
                  for (String prof : SettingManager.PROFILES) {
                      boolean active = prof.equalsIgnoreCase(SettingManager.getCurrentProfile());
                      ctx.fill(x + 12, py, x + w - 12, py + 24, active ? 0xFF1E3A8A : 0xFF111827);
                      drawRectBorder(ctx, x + 12, py, w - 24, 24, active ? 0xFF2563EB : 0xFF1E293B);
                      ctx.drawTextWithShadow(
                              this.textRenderer,
                              "Profile: " + prof.toUpperCase(Locale.ROOT) + (active ? " [ACTIVE]" : " (Click to Load)"),
                              x + 20,
                              py + 8,
                              active ? 0xFF38BDF8 : 0xFFFFFFFF
                      );
                      py += 30;
                  }
              }

              private void renderHudEditorMode(DrawContext ctx) {
                  ctx.fill(0, 0, this.width, this.height, 0x55000000);
                  ctx.drawCenteredTextWithShadow(
                          this.textRenderer,
                          "HUD Layout Editor — Drag any HUD box | Right-Click anywhere to return to GUI",
                          this.width / 2,
                          10,
                          0xFFFFFFFF
                  );
                  for (Module m : ModuleManager.all()) {
                      if (m.isEnabled()) {
                          m.onRenderHud(ctx);
                          drawRectBorder(ctx, m.getHudX() - 2, m.getHudY() - 2, 92, 18, 0xFF38BDF8);
                      }
                  }
              }

              private List<Module> getVisibleModules() {
                  if (!searchQuery.isBlank() || activeSidebar == SidebarTab.SEARCH) {
                      return ModuleManager.search(searchQuery);
                  }
                  if (activeSidebar == SidebarTab.FAVORITES) {
                      return ModuleManager.favorites();
                  }
                  return ModuleManager.byCategory(activeCategory);
              }

              private void drawPillSwitch(DrawContext ctx, int x, int y, boolean on) {
                  int w = 22;
                  int h = 11;
                  ctx.fill(x, y, x + w, y + h, on ? 0xFF2563EB : 0xFF334155);
                  int knobX = on ? (x + w - 9) : (x + 2);
                  ctx.fill(knobX, y + 2, knobX + 7, y + h - 2, 0xFFFFFFFF);
              }

              private void drawRectBorder(DrawContext ctx, int x, int y, int w, int h, int color) {
                  ctx.fill(x, y, x + w, y + 1, color);
                  ctx.fill(x, y + h - 1, x + w, y + h, color);
                  ctx.fill(x, y, x + 1, y + h, color);
                  ctx.fill(x + w - 1, y, x + w, y + h, color);
              }

              @Override
              public boolean mouseClicked(Click click, boolean bl) {
                  double mx = click.x();
                  double my = click.y();
                  int btn = click.button();

                  if (activeSidebar == SidebarTab.HUD_EDITOR) {
                      if (btn == 1) {
                          activeSidebar = SidebarTab.MODULES;
                          SettingManager.save();
                          return true;
                      }
                      for (Module m : ModuleManager.all()) {
                          if (m.isEnabled() && mx >= m.getHudX() - 4 && mx <= m.getHudX() + 94
                                  && my >= m.getHudY() - 4 && my <= m.getHudY() + 20) {
                              draggingHudModule = m;
                              dragOffsetX = (int) mx - m.getHudX();
                              dragOffsetY = (int) my - m.getHudY();
                              return true;
                          }
                      }
                      return true;
                  }

                  // Resize Grip (Bottom-Right 14x14 corner)
                  if (mx >= winX + winW - 14 && mx <= winX + winW && my >= winY + winH - 14 && my <= winY + winH) {
                      resizingWindow = true;
                      dragOffsetX = (int) mx - winW;
                      dragOffsetY = (int) my - winH;
                      return true;
                  }

                  // Close [X] button
                  if (mx >= winX + winW - 18 && mx <= winX + winW && my >= winY && my <= winY + 24) {
                      close();
                      return true;
                  }

                  int sidebarW = 104;
                  int topBarH = 30;

                  // Sidebar Tabs
                  int navY = winY + 38;
                  for (SidebarTab tab : SidebarTab.values()) {
                      if (mx >= winX + 4 && mx <= winX + sidebarW - 4 && my >= navY && my <= navY + 20) {
                          activeSidebar = tab;
                          searchFocused = (tab == SidebarTab.SEARCH);
                          scrollOffset = 0;
                          return true;
                      }
                      navY += 24;
                  }

                  // Top Category Tabs or Window Dragging
                  if (mx >= winX && mx <= winX + winW && my >= winY && my <= winY + topBarH) {
                      int catX = winX + sidebarW + 10;
                      for (Category cat : Category.values()) {
                          if (mx >= catX && mx <= catX + 62) {
                              activeCategory = cat;
                              activeSidebar = SidebarTab.MODULES;
                              scrollOffset = 0;
                              List<Module> list = ModuleManager.byCategory(cat);
                              if (!list.isEmpty()) {
                                  selectedModule = list.get(0);
                              }
                              return true;
                          }
                          catX += 64;
                      }
                      draggingWindow = true;
                      dragOffsetX = (int) mx - winX;
                      dragOffsetY = (int) my - winY;
                      return true;
                  }

                  int contentX = winX + sidebarW + 8;
                  int contentY = winY + topBarH + 8;
                  int contentW = winW - sidebarW - 16;
                  int contentH = winH - topBarH - 16;

                  if (activeSidebar == SidebarTab.PROFILES) {
                      int py = contentY + 30;
                      for (String prof : SettingManager.PROFILES) {
                          if (mx >= contentX + 12 && mx <= contentX + contentW - 12 && my >= py && my <= py + 24) {
                              SettingManager.switchProfile(prof);
                              return true;
                          }
                          py += 30;
                      }
                      return true;
                  }

                  int listW = Math.max(150, (int) (contentW * 0.42));
                  int inspectorX = contentX + listW + 8;
                  int inspectorW = contentW - listW - 8;

                  // Search Box Click
                  if (mx >= contentX + 6 && mx <= contentX + listW - 6 && my >= contentY + 19 && my <= contentY + 35) {
                      searchFocused = true;
                      if (btn == 1) {
                          searchQuery = "";
                      }
                      return true;
                  } else {
                      searchFocused = false;
                  }

                  // Module List Click
                  List<Module> modules = getVisibleModules();
                  int rowY = contentY + 40;
                  int maxRows = Math.max(1, (contentH - 44) / 28);
                  int startIdx = Math.max(0, Math.min(scrollOffset, Math.max(0, modules.size() - maxRows)));

                  for (int i = startIdx; i < Math.min(modules.size(), startIdx + maxRows); i++) {
                      Module mod = modules.get(i);
                      if (mx >= contentX + 6 && mx <= contentX + listW - 6 && my >= rowY && my <= rowY + 25) {
                          if (mx <= contentX + 20) {
                              mod.toggleFavorite();
                          } else if (mx >= contentX + listW - 36 || btn == 0) {
                              if (mx >= contentX + listW - 36) {
                                  mod.toggle();
                              }
                              selectedModule = mod;
                          } else if (btn == 1) {
                              selectedModule = mod;
                          }
                          return true;
                      }
                      rowY += 28;
                  }

                  // Inspector Panel Click
                  if (selectedModule != null && mx >= inspectorX && mx <= inspectorX + inspectorW) {
                      if (mx >= inspectorX + inspectorW - 36 && my >= contentY + 6 && my <= contentY + 24) {
                          selectedModule.toggle();
                          return true;
                      }

                      int sy = contentY + 69;
                      if (my >= sy && my <= sy + 20) {
                          if (btn == 1) {
                              selectedModule.setKeyBind(GLFW.GLFW_KEY_UNKNOWN);
                              listeningModuleBind = null;
                          } else {
                              listeningModuleBind = (listeningModuleBind == selectedModule) ? null : selectedModule;
                              listeningSettingBind = null;
                          }
                          return true;
                      }
                      sy += 23;

                      int ctrlX = inspectorX + inspectorW - 78;
                      int ctrlW = 66;
                      for (Setting<?> setting : selectedModule.getSettings()) {
                          if (my >= sy && my <= sy + 22) {
                              if (setting instanceof BoolSetting b) {
                                  b.toggle();
                              } else if (setting instanceof EnumSetting<?> e) {
                                  e.cycle();
                              } else if (setting instanceof KeybindSetting k) {
                                  if (btn == 1) {
                                      k.setValue(GLFW.GLFW_KEY_UNKNOWN);
                                      listeningSettingBind = null;
                                  } else {
                                      listeningSettingBind = (listeningSettingBind == k) ? null : k;
                                  }
                              } else if (setting instanceof DoubleSetting d) {
                                  if (mx >= ctrlX + ctrlW - 16) {
                                      d.step(btn == 0 ? 0.1 : -0.1);
                                  } else {
                                      draggingSlider = d;
                                      updateSliderValue(d, mx, ctrlX, ctrlW - 16);
                                  }
                              } else if (setting instanceof IntSetting i) {
                                  if (mx >= ctrlX + ctrlW - 16) {
                                      i.step(btn == 0 ? 10 : -10);
                                  } else {
                                      draggingSlider = i;
                                      updateSliderValue(i, mx, ctrlX, ctrlW - 16);
                                  }
                              }
                              return true;
                          }
                          sy += 24;
                      }
                  }

                  return super.mouseClicked(click, bl);
              }

              @Override
              public boolean mouseDragged(Click click, double deltaX, double deltaY) {
                  double mx = click.x();
                  double my = click.y();

                  if (draggingHudModule != null) {
                      draggingHudModule.setHudPos((int) mx - dragOffsetX, (int) my - dragOffsetY);
                      return true;
                  }
                  if (draggingWindow) {
                      winX = Math.max(0, Math.min(this.width - 100, (int) mx - dragOffsetX));
                      winY = Math.max(0, Math.min(this.height - 60, (int) my - dragOffsetY));
                      SettingManager.setGuiBounds(winX, winY, winW, winH);
                      return true;
                  }
                  if (resizingWindow) {
                      winW = Math.max(480, Math.min(this.width - winX - 6, (int) mx - dragOffsetX));
                      winH = Math.max(270, Math.min(this.height - winY - 6, (int) my - dragOffsetY));
                      SettingManager.setGuiBounds(winX, winY, winW, winH);
                      return true;
                  }
                  if (draggingSlider != null) {
                      int sidebarW = 104;
                      int contentX = winX + sidebarW + 8;
                      int contentW = winW - sidebarW - 16;
                      int listW = Math.max(150, (int) (contentW * 0.42));
                      int inspectorX = contentX + listW + 8;
                      int inspectorW = contentW - listW - 8;
                      int ctrlX = inspectorX + inspectorW - 78;
                      updateSliderValue(draggingSlider, mx, ctrlX, 50);
                      return true;
                  }
                  return super.mouseDragged(click, deltaX, deltaY);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  draggingWindow = false;
                  resizingWindow = false;
                  draggingSlider = null;
                  draggingHudModule = null;
                  SettingManager.save();
                  return super.mouseReleased(click);
              }

              @Override
              public boolean mouseScrolled(double mouseX, double mouseY, double horizontalAmount, double verticalAmount) {
                  if (verticalAmount < 0) {
                      scrollOffset++;
                  } else if (verticalAmount > 0 && scrollOffset > 0) {
                      scrollOffset--;
                  }
                  return true;
              }

              @Override
              public boolean keyPressed(KeyInput keyInput) {
                  int keyCode = keyInput.key();

                  if (listeningModuleBind != null) {
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_DELETE || keyCode == GLFW.GLFW_KEY_BACKSPACE) {
                          listeningModuleBind.setKeyBind(GLFW.GLFW_KEY_UNKNOWN);
                      } else {
                          listeningModuleBind.setKeyBind(keyCode);
                      }
                      listeningModuleBind = null;
                      SettingManager.save();
                      return true;
                  }

                  if (listeningSettingBind != null) {
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_DELETE || keyCode == GLFW.GLFW_KEY_BACKSPACE) {
                          listeningSettingBind.setValue(GLFW.GLFW_KEY_UNKNOWN);
                      } else {
                          listeningSettingBind.setValue(keyCode);
                      }
                      listeningSettingBind = null;
                      SettingManager.save();
                      return true;
                  }

                  if (searchFocused) {
                      if (keyCode == GLFW.GLFW_KEY_BACKSPACE && !searchQuery.isEmpty()) {
                          searchQuery = searchQuery.substring(0, searchQuery.length() - 1);
                          return true;
                      }
                      if (keyCode == GLFW.GLFW_KEY_ESCAPE || keyCode == GLFW.GLFW_KEY_ENTER) {
                          searchFocused = false;
                          return true;
                      }
                  }

                  return super.keyPressed(keyInput);
              }

              @Override
              public boolean charTyped(CharInput charInput) {
                  if (searchFocused) {
                      String ch = charInput.asString();
                      if (ch != null && !ch.isEmpty() && searchQuery.length() < 24) {
                          searchQuery += ch;
                          scrollOffset = 0;
                          return true;
                      }
                  }
                  return super.charTyped(charInput);
              }

              private void updateSliderValue(Setting<?> setting, double mouseX, int x, int width) {
                  double pct = Math.max(0.0, Math.min(1.0, (mouseX - x) / (double) Math.max(1, width)));
                  if (setting instanceof DoubleSetting d) {
                      double raw = d.getMin() + pct * (d.getMax() - d.getMin());
                      d.setValue(Math.round(raw * 10.0) / 10.0);
                  } else if (setting instanceof IntSetting i) {
                      int val = (int) Math.round(i.getMin() + pct * (i.getMax() - i.getMin()));
                      i.setValue(val);
                  }
              }

              @Override
              public void close() {
                  SettingManager.setGuiBounds(winX, winY, winW, winH);
                  SettingManager.save();
                  super.close();
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }
          }
