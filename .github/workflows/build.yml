          cat << 'EOF' > src/main/java/bench/client/mixin/MinecraftClientMixin.java
          package bench.client.mixin;

          import bench.client.core.ModuleManager;
          import bench.client.modules.misc.Timer;
          import bench.client.modules.player.FastPlace;
          import net.minecraft.client.MinecraftClient;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.Unique;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(MinecraftClient.class)
          public abstract class MinecraftClientMixin {
              @Shadow
              private int itemUseCooldown;

              @Shadow
              public abstract void tick();

              @Unique
              private double benchTimerAccumulator = 0.0;

              @Unique
              private boolean benchInExtraTick = false;

              @Inject(method = "tick", at = @At("HEAD"))
              private void onTickHead(CallbackInfo ci) {
                  FastPlace fastPlace = ModuleManager.get(FastPlace.class);
                  if (fastPlace != null && fastPlace.isEnabled()) {
                      int max = fastPlace.cooldown.getValue();
                      if (this.itemUseCooldown > max) {
                          this.itemUseCooldown = max;
                      }
                  }

                  if (!benchInExtraTick) {
                      Timer timer = ModuleManager.get(Timer.class);
                      if (timer != null && timer.isEnabled()) {
                          double extra = timer.speed.getValue() - 1.0;
                          if (extra > 0.0) {
                              benchTimerAccumulator += extra;
                              if (benchTimerAccumulator >= 1.0) {
                                  benchTimerAccumulator -= 1.0;
                                  benchInExtraTick = true;
                                  try {
                                      this.tick();
                                  } finally {
                                      benchInExtraTick = false;
                                  }
                              }
                          }
                      }
                  }
              }
          }
