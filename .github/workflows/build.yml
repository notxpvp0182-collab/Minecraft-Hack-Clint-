      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod with Gradle
        run: |
          gradle clean build
          cp build/libs/benchclient-2.0.0.jar benchclient-1.21.11.jar

      - name: Upload benchclient-1.21.11.jar and Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: benchclient-1.21.11-release
          path: |
            benchclient-1.21.11.jar
            build/libs/*.jar
            !build/libs/*-sources.jar
            benchclient-src.zip
