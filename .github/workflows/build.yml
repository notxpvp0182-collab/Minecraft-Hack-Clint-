name: Build BenchClient 1.21.11 JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          rm -rf src build
          mkdir -p src/main/java/bench/client/core
          mkdir -p src/main/java/bench/client/gui
          mkdir -p src/main/java/bench/client/mixin
          mkdir -p src/main/java/bench/client/modules/combat
          mkdir -p src/main/java/bench/client/modules/movement
          mkdir -p src/main/java/bench/client/modules/render
          mkdir -p src/main/java/bench/client/modules/player
          mkdir -p src/main/java/bench/client/modules/misc
          mkdir -p src/main/resources/assets/benchclient/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'benchclient'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          loom_version=1.14.10
          fabric_version=0.141.6+1.21.11
          mod_version=2.0.0
          maven_group=bench.client
          archives_base_name=benchclient
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "benchclient",
            "version": "${version}",
            "name": "BenchClient",
            "description": "Wurst-style Client Utility & AutoPvP Mod for Minecraft 1.21.11. Credit: Ahmad.",
            "authors": [
              "Ahmad"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "bench.client.BenchClient"
              ]
            },
            "mixins": [
              "benchclient.mixins.json"
            ],
            "depends": {
              "fabricloader": "*",
              "minecraft": "=1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/benchclient.mixins.json
          {
            "required": true,
            "minVersion": "0.8",
            "package": "bench.client.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "BlockRenderMixin",
              "PlayerEntityMixin",
              "ClientPlayerEntityMixin",
              "EntityStepMixin",
              "GameRendererMixin",
              "MinecraftClientMixin",
              "ClientPlayerInteractionManagerMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/benchclient/lang/en_us.json
          {
            "key.category.benchclient.general": "BenchClient",
            "key.benchclient.open_gui": "Open ClickGUI",
            "key.benchclient.cycle_module": "Cycle Module"
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/BenchClient.java
          package bench.client;

          import bench.client.core.Module;
          import bench.client.core.ModuleManager;
          import bench.client.core.SettingManager;
          import bench.client.gui.ClickGui;
          import bench.client.modules.combat.AimAssist;
          import bench.client.modules.combat.AutoFight;
          import bench.client.modules.combat.AutoTotem;
          import bench.client.modules.combat.Criticals;
          import bench.client.modules.combat.KillAura;
          import bench.client.modules.combat.Reach;
          import bench.client.modules.combat.TriggerBot;
          import bench.client.modules.combat.Velocity;
          import bench.client.modules.misc.AntiAFK;
          import bench.client.modules.misc.AutoRespawn;
          import bench.client.modules.misc.ChatSuffix;
          import bench.client.modules.misc.Timer;
          import bench.client.modules.movement.AutoJump;
          import bench.client.modules.movement.Fly;
          import bench.client.modules.movement.NoFall;
          import bench.client.modules.movement.NoSlow;
          import bench.client.modules.movement.SafeWalk;
          import bench.client.modules.movement.Speed;
          import bench.client.modules.movement.Sprint;
          import bench.client.modules.movement.Step;
          import bench.client.modules.player.AutoArmor;
          import bench.client.modules.player.AutoTool;
          import bench.client.modules.player.FastBreak;
          import bench.client.modules.player.FastPlace;
          import bench.client.modules.render.ESP;
          import bench.client.modules.render.Fullbright;
          import bench.client.modules.render.Hud;
          import bench.client.modules.render.Nametags;
          import bench.client.modules.render.Tracers;
          import bench.client.modules.render.Xray;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.message.v1.ClientSendMessageEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class BenchClient implements ClientModInitializer {
              public static final KeyBinding.Category KEY_CATEGORY = KeyBinding.Category.create(
                      Identifier.of("benchclient", "general")
              );

              private static KeyBinding openGuiKey;
              private static KeyBinding cycleModuleKey;

              @Override
              @SuppressWarnings("deprecation")
              public void onInitializeClient() {
                  // COMBAT
                  AutoFight autoFight = new AutoFight();
                  ModuleManager.register(autoFight);
                  ModuleManager.register(new AimAssist());
                  ModuleManager.register(new KillAura());
                  ModuleManager.register(new TriggerBot());
                  ModuleManager.register(new Criticals());
                  ModuleManager.register(new AutoTotem());
                  ModuleManager.register(new Reach());
                  ModuleManager.register(new Velocity());

                  // MOVEMENT
                  ModuleManager.register(new Sprint());
                  ModuleManager.register(new Speed());
                  ModuleManager.register(new Fly());
                  ModuleManager.register(new Step());
                  ModuleManager.register(new NoFall());
                  ModuleManager.register(new NoSlow());
                  ModuleManager.register(new SafeWalk());
                  ModuleManager.register(new AutoJump());

                  // RENDER
                  Hud hud = new Hud();
                  ModuleManager.register(hud);
                  ESP esp = new ESP();
                  ModuleManager.register(esp);
                  Tracers tracers = new Tracers();
                  ModuleManager.register(tracers);
                  Nametags nametags = new Nametags();
                  ModuleManager.register(nametags);
                  ModuleManager.register(new Fullbright());
                  ModuleManager.register(new Xray());

                  // PLAYER
                  ModuleManager.register(new AutoArmor());
                  ModuleManager.register(new AutoTool());
                  ModuleManager.register(new FastPlace());
                  ModuleManager.register(new FastBreak());

                  // MISC
                  ModuleManager.register(new AutoRespawn());
                  ModuleManager.register(new Timer());
                  ModuleManager.register(new AntiAFK());
                  ChatSuffix chatSuffix = new ChatSuffix();
                  ModuleManager.register(chatSuffix);

                  SettingManager.load();

                  openGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.open_gui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          KEY_CATEGORY
                  ));

                  cycleModuleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.benchclient.cycle_module",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_CONTROL,
                          KEY_CATEGORY
                  ));

                  HudRenderCallback.EVENT.register((drawContext, renderTickCounter) -> {
                      if (esp.isEnabled()) {
                          esp.renderOverlay(drawContext);
                      }
                      if (tracers.isEnabled()) {
                          tracers.renderOverlay(drawContext);
                      }
                      if (nametags.isEnabled()) {
                          nametags.renderOverlay(drawContext);
                      }
                      if (autoFight.isEnabled()) {
                          autoFight.renderTargetHud(drawContext);
                      }
                      hud.renderHud(drawContext);
                  });

                  ClientSendMessageEvents.MODIFY_CHAT.register(chatSuffix::modifyMessage);

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openGuiKey.wasPressed()) {
                          if (client.currentScreen instanceof ClickGui) {
                              client.setScreen(null);
                          } else {
                              client.setScreen(new ClickGui());
                          }
                      }
                      while (cycleModuleKey.wasPressed()) {
                          ModuleManager.cycle();
                      }
                      if (client.player != null && client.world != null) {
                          for (Module m : ModuleManager.all()) {
                              int key = m.getKeyBind();
                              if (key != GLFW.GLFW_KEY_UNKNOWN && client.currentScreen == null) {
                                  boolean down = InputUtil.isKeyPressed(client.getWindow(), key);
                                  if (down) {
                                      if (!m.wasKeyPressedLastTick()) {
                                          m.setKeyPressedLastTick(true);
                                          m.toggle();
                                      }
                                  } else {
                                      m.setKeyPressedLastTick(false);
                                  }
                              } else {
                                  m.setKeyPressedLastTick(false);
                              }
                          }
                          ModuleManager.tickAll(client);
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > src/main/java/bench/client/core/Category.java
