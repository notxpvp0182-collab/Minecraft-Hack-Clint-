          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod with Gradle
        run: |
          gradle clean build
          cp build/libs/EternalBenchClient-2.5.0.jar EternalBenchClient-1.21.11.jar

      - name: Upload EternalBenchClient-1.21.11.jar and Source ZIP
        uses: actions/upload-artifact@v4
