          package bench.client.modules.combat;

          import bench.client.core.BoolSetting;
          import bench.client.core.Category;
          import bench.client.core.DoubleSetting;
          import bench.client.core.EnumSetting;
          import bench.client.core.KeybindSetting;
          import bench.client.core.Module;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.Hand;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;
          import org.lwjgl.glfw.GLFW;

          import java.util.Locale;

          public class AutoFight extends Module {
              public enum TargetMode {
                  PLAYERS,
                  ALL
              }

              public final EnumSetting<TargetMode> targetMode = add(new EnumSetting<>("Target", TargetMode.PLAYERS));
              public final KeybindSetting lockTargetKey = add(new KeybindSetting("LockKey", GLFW.GLFW_KEY_R));
              public final DoubleSetting hitReach = add(new DoubleSetting("HitReach", 3.0, 2.5, 6.0));
              public final DoubleSetting searchRange = add(new DoubleSetting("ScanRange", 16.0, 6.0, 32.0));
              public final DoubleSetting aimSpeed = add(new DoubleSetting("AimSpeed", 0.38, 0.10, 1.0));
              public final BoolSetting autoMoveCombo = add(new BoolSetting("AutoWASD", true));
              public final BoolSetting autoJumpCrit = add(new BoolSetting("AutoJumpCrit", true));
              public final BoolSetting strafeCircle = add(new BoolSetting("StrafeCombo", true));

              private LivingEntity lockedTarget = null;
              private boolean lockKeyHeld = false;
              private int strafeDir = 1;
              private int strafeTimer = 0;
              private int wTapTicks = 0;

              public AutoFight() {
                  super("AutoFight", Category.COMBAT);
              }

              @Override
              public void onDisable() {
                  lockedTarget = null;
                  releaseMovementKeys(MinecraftClient.getInstance());
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.world == null || client.interactionManager == null) {
                      return;
                  }
                  if (client.currentScreen != null) {
                      releaseMovementKeys(client);
                      return;
                  }

                  int lockCode = lockTargetKey.getValue();
                  if (lockCode != GLFW.GLFW_KEY_UNKNOWN && lockCode > 0) {
                      boolean down = InputUtil.isKeyPressed(client.getWindow(), lockCode);
                      if (down && !lockKeyHeld) {
                          lockKeyHeld = true;
                          LivingEntity candidate = findBestTarget(client);
                          if (candidate != null) {
                              lockedTarget = candidate;
                              client.player.sendMessage(
                                      Text.literal("AutoFight Locked: " + candidate.getName().getString())
                                              .formatted(Formatting.GREEN),
                                      true
                              );
                          }
                      } else if (!down) {
                          lockKeyHeld = false;
                      }
                  }

                  double maxScanSq = searchRange.getValue() * searchRange.getValue();
                  if (lockedTarget != null) {
                      if (!lockedTarget.isAlive() || lockedTarget.isDead() || lockedTarget.isRemoved()
                              || client.player.squaredDistanceTo(lockedTarget) > maxScanSq) {
                          lockedTarget = null;
                      }
                  }

                  if (lockedTarget == null) {
                      lockedTarget = findBestTarget(client);
                  }

                  if (lockedTarget == null) {
                      releaseMovementKeys(client);
                      return;
                  }

                  smoothRotateTowards(client.player, lockedTarget, aimSpeed.getValue().floatValue());

                  double dist = Math.sqrt(client.player.squaredDistanceTo(lockedTarget));
                  double reach = hitReach.getValue();

                  if (autoMoveCombo.getValue()) {
                      if (wTapTicks > 0) {
                          wTapTicks--;
                          client.options.forwardKey.setPressed(false);
                      } else {
                          client.options.forwardKey.setPressed(dist > 1.35);
                      }

                      client.options.backKey.setPressed(dist < 0.9);
                      client.player.setSprinting(true);

                      if (strafeCircle.getValue() && dist <= reach + 1.2) {
                          strafeTimer++;
                          if (strafeTimer > 18 || client.player.horizontalCollision) {
                              strafeDir = -strafeDir;
                              strafeTimer = 0;
                          }
                          client.options.leftKey.setPressed(strafeDir < 0);
                          client.options.rightKey.setPressed(strafeDir > 0);
                      } else {
                          client.options.leftKey.setPressed(false);
                          client.options.rightKey.setPressed(false);
                      }

                      if (autoJumpCrit.getValue() && client.player.isOnGround()) {
                          if (dist <= reach + 1.5 || client.player.horizontalCollision) {
                              client.player.jump();
                          }
                      }
                  }

                  if (dist <= reach) {
                      float cooldown = client.player.getAttackCooldownProgress(0.5f);
                      boolean readyToCrit = !autoJumpCrit.getValue()
                              || client.player.fallDistance > 0.05f
                              || client.player.isOnGround()
                              || client.player.isSubmergedInWater();

                      if (cooldown >= 0.92f && readyToCrit) {
                          client.interactionManager.attackEntity(client.player, lockedTarget);
                          client.player.swingHand(Hand.MAIN_HAND);
                          wTapTicks = 2;
                      }
                  }
              }

              public static void smoothRotateTowards(ClientPlayerEntity player, Entity target, float speed) {
                  Vec3d eyePos = player.getEyePos();
                  Vec3d targetPos = new Vec3d(
                          target.getX(),
                          target.getY() + target.getHeight() * 0.68,
                          target.getZ()
                  );
                  Vec3d diff = targetPos.subtract(eyePos);
                  double horizDist = Math.hypot(diff.x, diff.z);

                  float desiredYaw = (float) (MathHelper.atan2(diff.z, diff.x) * (180.0 / Math.PI)) - 90.0f;
                  float desiredPitch = (float) (-(MathHelper.atan2(diff.y, horizDist) * (180.0 / Math.PI)));

                  float yawDelta = MathHelper.wrapDegrees(desiredYaw - player.getYaw());
                  float pitchDelta = MathHelper.wrapDegrees(desiredPitch - player.getPitch());

                  float stepYaw = yawDelta * MathHelper.clamp(speed, 0.08f, 1.0f);
                  float stepPitch = pitchDelta * MathHelper.clamp(speed, 0.08f, 1.0f);

                  float newYaw = player.getYaw() + stepYaw;
                  float newPitch = MathHelper.clamp(player.getPitch() + stepPitch, -89.0f, 89.0f);

                  player.setYaw(newYaw);
                  player.setPitch(newPitch);
                  player.headYaw = newYaw;
                  player.bodyYaw = newYaw;
              }

              private LivingEntity findBestTarget(MinecraftClient client) {
                  double maxDistSq = searchRange.getValue() * searchRange.getValue();
                  LivingEntity best = null;
                  double bestScore = Double.MAX_VALUE;

                  for (Entity entity : client.world.getEntities()) {
                      if (entity == client.player || !(entity instanceof LivingEntity living)) {
                          continue;
                      }
                      if (!living.isAlive() || living.isDead()) {
                          continue;
                      }
                      if (targetMode.getValue() == TargetMode.PLAYERS && !(living instanceof PlayerEntity)) {
                          continue;
                      }
                      double dSq = client.player.squaredDistanceTo(living);
                      if (dSq <= maxDistSq && dSq < bestScore) {
                          bestScore = dSq;
                          best = living;
                      }
                  }
                  return best;
              }

              private void releaseMovementKeys(MinecraftClient client) {
                  if (client != null && client.options != null) {
                      client.options.forwardKey.setPressed(false);
                      client.options.backKey.setPressed(false);
                      client.options.leftKey.setPressed(false);
                      client.options.rightKey.setPressed(false);
                  }
              }

              public void renderTargetHud(DrawContext context) {
                  if (lockedTarget == null || !lockedTarget.isAlive()) {
                      return;
                  }
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null) {
                      return;
                  }
                  double dist = Math.sqrt(client.player.squaredDistanceTo(lockedTarget));
                  String info = String.format(
                          Locale.ROOT,
                          "Target: %s | HP: %.1f | Dist: %.1fm",
                          lockedTarget.getName().getString(),
                          lockedTarget.getHealth(),
                          dist
                  );
                  int w = client.textRenderer.getWidth(info) + 10;
                  int cx = context.getScaledWindowWidth() / 2 - w / 2;
                  int cy = context.getScaledWindowHeight() - 62;
                  context.fill(cx, cy, cx + w, cy + 16, 0xCC181824);
                  context.fill(cx, cy, cx + w, cy + 2, 0xFFFF4444);
                  context.drawTextWithShadow(client.textRenderer, info, cx + 5, cy + 4, 0xFFFFFFFF);
              }
          }
