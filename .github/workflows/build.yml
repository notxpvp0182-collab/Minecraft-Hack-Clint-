              private static int findAxeHotbarSlot(PlayerInventory inv, AxeSlotPref pref) {
                  if (pref == AxeSlotPref.SLOT_1 && inv.getStack(0).isIn(ItemTags.AXES)) return 0;
                  if (pref == AxeSlotPref.SLOT_2 && inv.getStack(1).isIn(ItemTags.AXES)) return 1;
                  if (pref == AxeSlotPref.SLOT_3 && inv.getStack(2).isIn(ItemTags.AXES)) return 2;
                  for (int i = 0; i < 9; i++) {
                      if (inv.getStack(i).isIn(ItemTags.AXES)) {
                          return i;
                      }
                  }
                  return -1;
              }

              private static int countItemInInventory(PlayerInventory inv, net.minecraft.item.Item item) {
                  int total = 0;
                  for (int i = 0; i < inv.size(); i++) {
                      ItemStack s = inv.getStack(i);
                      if (s.isOf(item)) {
                          total += s.getCount();
                      }
                  }
                  return total;
              }

              private static void smoothAimAt(ClientPlayerEntity player, Entity target, float speed) {
                  Vec3d eye = player.getEyePos();
                  Vec3d tPos = new Vec3d(target.getX(), target.getY() + target.getHeight() * 0.68, target.getZ());
                  Vec3d diff = tPos.subtract(eye);
                  double horiz = Math.hypot(diff.x, diff.z);
                  float yaw = (float) (MathHelper.atan2(diff.z, diff.x) * (180.0 / Math.PI)) - 90.0f;
                  float pitch = (float) (-(MathHelper.atan2(diff.y, horiz) * (180.0 / Math.PI)));
                  float dYaw = MathHelper.wrapDegrees(yaw - player.getYaw());
                  float dPitch = MathHelper.wrapDegrees(pitch - player.getPitch());
                  player.setYaw(player.getYaw() + dYaw * speed);
                  player.setPitch(MathHelper.clamp(player.getPitch() + dPitch * speed, -89.0f, 89.0f));
              }

              private static List<BlockPos> computePattern(BlockPos center, Direction face, MiningPattern pat) {
                  List<BlockPos> list = new ArrayList<>();
                  if (pat == MiningPattern.SINGLE) {
                      list.add(center);
                      return list;
                  }
                  if (pat == MiningPattern.PATTERN_1X3) {
                      list.add(center.down());
                      list.add(center);
                      list.add(center.up());
                      return list;
                  }
                  for (int a = -1; a <= 1; a++) {
                      for (int b = -1; b <= 1; b++) {
                          if (face.getAxis() == Direction.Axis.Y) {
                              list.add(center.add(a, 0, b));
                          } else if (face.getAxis() == Direction.Axis.Z) {
                              list.add(center.add(a, b, 0));
                          } else {
                              list.add(center.add(0, b, a));
                          }
                      }
                  }
                  return list;
              }

              private static boolean isOreBlock(Block b) {
                  return b == Blocks.DIAMOND_ORE || b == Blocks.DEEPSLATE_DIAMOND_ORE
                          || b == Blocks.IRON_ORE || b == Blocks.DEEPSLATE_IRON_ORE
                          || b == Blocks.GOLD_ORE || b == Blocks.DEEPSLATE_GOLD_ORE
                          || b == Blocks.EMERALD_ORE || b == Blocks.DEEPSLATE_EMERALD_ORE
                          || b == Blocks.REDSTONE_ORE || b == Blocks.DEEPSLATE_REDSTONE_ORE
                          || b == Blocks.LAPIS_ORE || b == Blocks.DEEPSLATE_LAPIS_ORE
                          || b == Blocks.ANCIENT_DEBRIS || b == Blocks.NETHER_QUARTZ_ORE;
              }

              private static boolean isExposedToAir(MinecraftClient client, BlockPos pos) {
                  for (Direction dir : Direction.values()) {
                      BlockState adj = client.world.getBlockState(pos.offset(dir));
                      if (adj.isAir() || !adj.isOpaque()) {
                          return true;
                      }
                  }
                  return false;
              }

              public static int[] worldToScreen(DrawContext context, Vec3d worldPos) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null || client.gameRenderer == null) {
                      return null;
                  }
                  Camera camera = client.gameRenderer.getCamera();
                  Vec3d camPos = client.player.getEyePos();
                  Quaternionf invRot = new Quaternionf(camera.getRotation()).conjugate();
                  Vec3d rel = worldPos.subtract(camPos);
                  Vector3f v = new Vector3f((float) rel.x, (float) rel.y, (float) rel.z).rotate(invRot);
                  if (v.z >= -0.1f) {
                      return null;
                  }
                  int sw = context.getScaledWindowWidth();
                  int sh = context.getScaledWindowHeight();
                  double fov = client.options.getFov().getValue();
                  double f = (sh / 2.0) / Math.tan(Math.toRadians(fov / 2.0));
                  double depth = -v.z;
                  int sx = (int) (sw / 2.0 + (v.x / depth) * f);
                  int sy = (int) (sh / 2.0 - (v.y / depth) * f);
                  return new int[]{sx, sy, (int) Math.max(1.0, depth)};
              }

              private static void renderEntityBoxes(DrawContext context, double maxRange, int color, boolean checkSight) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null || client.world == null) {
                      return;
                  }
                  double maxSq = maxRange * maxRange;
                  for (PlayerEntity p : client.world.getPlayers()) {
                      if (p == client.player || !p.isAlive()) {
                          continue;
                      }
                      if (checkSight && !client.player.canSee(p)) {
                          continue;
                      }
                      if (client.player.squaredDistanceTo(p) > maxSq) {
                          continue;
                      }
                      int[] scr = worldToScreen(context, new Vec3d(p.getX(), p.getY() + p.getHeight() * 0.5, p.getZ()));
                      if (scr != null) {
                          int h = Math.max(10, 120 / scr[2]);
                          int w = Math.max(6, h / 2);
                          int x1 = scr[0] - w / 2;
                          int y1 = scr[1] - h / 2;
                          int x2 = scr[0] + w / 2;
                          int y2 = scr[1] + h / 2;
                          context.fill(x1, y1, x2, y1 + 1, color);
                          context.fill(x1, y2 - 1, x2, y2, color);
                          context.fill(x1, y1, x1 + 1, y2, color);
                          context.fill(x2 - 1, y1, x2, y2, color);
                      }
                  }
              }

              public static void drawHudBadge(DrawContext context, int x, int y, String text, int accentColor) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  int w = client.textRenderer.getWidth(text) + 12;
                  context.fill(x, y, x + w, y + 15, 0xCC0B0F1A);
                  context.fill(x, y, x + 2, y + 15, accentColor);
                  context.drawTextWithShadow(client.textRenderer, text, x + 6, y + 4, 0xFFFFFFFF);
              }

              private static void drawKeyBox(DrawContext ctx, MinecraftClient client, String key, int x, int y, int w, int h, boolean pressed) {
                  ctx.fill(x, y, x + w, y + h, pressed ? 0xFF2563EB : 0xCC0D1322);
                  ctx.drawCenteredTextWithShadow(client.textRenderer, key, x + w / 2, y + 5, 0xFFFFFFFF);
              }

              private static void drawDottedLine(DrawContext context, int x0, int y0, int x1, int y1, int color) {
                  int dx = x1 - x0;
                  int dy = y1 - y0;
                  int steps = Math.min(160, Math.max(Math.abs(dx), Math.abs(dy)));
                  if (steps == 0) return;
                  for (int i = 0; i <= steps; i += 3) {
                      int px = x0 + (dx * i) / steps;
                      int py = y0 + (dy * i) / steps;
                      context.fill(px, py, px + 1, py + 1, color);
                  }
              }
          }
