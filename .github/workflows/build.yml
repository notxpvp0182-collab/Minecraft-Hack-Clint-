          public class Hud extends Module {
              private static final EquipmentSlot[] ARMOR_SLOTS = {
                      EquipmentSlot.HEAD,
                      EquipmentSlot.CHEST,
                      EquipmentSlot.LEGS,
                      EquipmentSlot.FEET
              };

              public final BoolSetting showFps = add(new BoolSetting("FPS", true));
              public final BoolSetting showCoords = add(new BoolSetting("Coords", true));
              public final BoolSetting showSpeed = add(new BoolSetting("Speed", true));
              public final BoolSetting showArmor = add(new BoolSetting("Armor", true));
              public final BoolSetting showArrayList = add(new BoolSetting("ActiveList", true));

              public Hud() {
                  super("Hud", Category.RENDER, GLFW.GLFW_KEY_H);
                  setEnabled(true);
              }

              @Override
              public void onTick(MinecraftClient client) {
              }

              public void renderHud(DrawContext context) {
                  if (!isEnabled()) {
                      return;
                  }
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player == null || client.getDebugHud().shouldShowDebugHud()) {
                      return;
                  }

                  int y = 6;
                  context.drawTextWithShadow(client.textRenderer, "BenchClient v2.0 (1.21.11)", 6, y, 0xFFFF8800);
                  y += 12;

                  if (showFps.getValue()) {
                      context.drawTextWithShadow(client.textRenderer, "FPS: " + client.getCurrentFps(), 6, y, 0xFFFFFFFF);
                      y += 10;
                  }

                  if (showCoords.getValue()) {
                      String coords = String.format(
                              Locale.ROOT,
                              "XYZ: %.1f, %.1f, %.1f",
                              client.player.getX(),
                              client.player.getY(),
                              client.player.getZ()
                      );
                      context.drawTextWithShadow(client.textRenderer, coords, 6, y, 0xFFFFFFFF);
                      y += 10;
                  }

                  if (showSpeed.getValue()) {
                      double dx = client.player.getX() - client.player.lastRenderX;
                      double dz = client.player.getZ() - client.player.lastRenderZ;
                      double bps = Math.hypot(dx, dz) * 20.0;
                      context.drawTextWithShadow(client.textRenderer, String.format(Locale.ROOT, "Speed: %.2f b/s", bps), 6, y, 0xFFFFFFFF);
                      y += 10;
                  }

                  if (showArmor.getValue()) {
                      for (EquipmentSlot slot : ARMOR_SLOTS) {
                          ItemStack armor = client.player.getEquippedStack(slot);
                          if (!armor.isEmpty() && armor.isDamageable()) {
                              int remaining = armor.getMaxDamage() - armor.getDamage();
                              String txt = armor.getName().getString() + ": " + remaining + "/" + armor.getMaxDamage();
                              context.drawTextWithShadow(client.textRenderer, txt, 6, y, 0xFFCCCCCC);
                              y += 10;
                          }
                      }
                  }

                  if (showArrayList.getValue()) {
                      int rightX = context.getScaledWindowWidth() - 6;
                      int modY = 6;
                      for (Module mod : ModuleManager.all()) {
                          if (mod.isEnabled()) {
                              String label = mod.getName();
                              int w = client.textRenderer.getWidth(label);
                              context.drawTextWithShadow(client.textRenderer, label, rightX - w, modY, 0xFF55FFAA);
                              modY += 10;
                          }
                      }
                  }
              }
          }
